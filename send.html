.app{max-width:480px;margin:0 auto;padding:14px 13px 36px;}
.header{text-align:center;margin-bottom:16px;padding-top:6px;}

.header-sub{font-size:11px;color:var(--text-hint);margin-top:2px;}
.deadline-alert{display:none;background:var(--orange);color:#fff;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;font-size:12px;font-weight:600;line-height:1.5;}

.card{background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;}
.slabel{font-size:11px;color:var(--text-sub);margin-bottom:9px;font-weight:600;}
.vendor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.vbtn{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:8px;cursor:pointer;text-align:left;}

.vbtn .vn{font-size:10px;font-weight:600;color:var(--text);line-height:1.3;}
.vbtn .vm{font-size:9px;margin-top:4px;font-weight:600;}
.vm-line{color:var(--green-line);}
.vm-sms{color:var(--green-sms);}
.vm-email{color:var(--blue);}
.toggle-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:10px;}
.toggle{position:relative;width:38px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#d1d5db;border-radius:22px;transition:.2s;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}

.toggle-txt.on{color:var(--amber);}

.flex-expand.open{display:block;}
.flex-expand-inner{display:flex;align-items:center;justify-content:space-between;}
.flex-expand-txt{font-size:11px;color:#92400e;line-height:1.5;}
.flex-expand-txt small{display:block;font-weight:400;font-size:10px;}

.cal-month-label{font-size:13px;font-weight:600;color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cal-dh{text-align:center;font-size:9px;color:var(--text-hint);padding:3px 0;font-weight:600;}
.cal-cell{text-align:center;padding:6px 1px;font-size:12px;cursor:pointer;color:var(--text);border-radius:50%;-webkit-user-select:none;}

.cal-cell.empty{cursor:default;}
.cal-cell.unavail{color:var(--border-md);cursor:not-allowed;opacity:.4;}

.cal-cell.selected{background:var(--orange);color:#fff;font-weight:600;}
.cal-cell.today{color:var(--orange);font-weight:700;}

.cal-deadline{font-size:11px;margin-top:4px;font-weight:600;}

.dl-soon{color:var(--amber);}

.changelog-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:400;align-items:center;justify-content:center;padding:20px;}

.changelog-items li::before{content:"✦ ";color:var(--orange);font-size:10px;}
.changelog-ok{width:100%;padding:13px;background:var(--orange);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;}
.changelog-ok:active{opacity:.85;}

</style>

   ok:function(dt){return dow(dt)===5;},
   dl:function(dt){var p=new Date(dt);p.setDate(p.getDate()-1);while(dow(p)===0||dow(p)===6||isHoliday(p))p.setDate(p.getDate()-1);return 'Order by: '+p.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' by 12:00 PM';},
   items:[{n:'Hondashi',u:'BOX'},{n:'Miso Dispenser',u:'BAG'},{n:'Mizkan Rice Vinegar',u:'BTL'},{n:'MSG Aji No Moto 1LB',u:'BAG'},{n:'Rice Sekka 40LB',u:'BAG'},{n:'Soy Sauce Yamasa 5GAL',u:'CTN'},{n:'Starch Potato Katakuriko 5LB',u:'CS'},{n:'Sukiyaki Sauce 5.4LB',u:'BOX'},{n:'Wakame Seaweed 0.8 sm bag',u:'BAG'},{n:'Wasabi Nama Fresh FRZ 800G',u:'BAG'}]},
  {id:'wongs',name:"Wong's Meat Market, Ltd.",short:"Wong's Meat Market",method:'sms',
   di:'Delivery: Mon-Fri (no holidays) | Order deadline: Previous day by 2:00 PM',tbd:false,
   ok:function(dt){return dow(dt)>=1&&dow(dt)<=5&&!isHoliday(dt);},
   dl:function(dt){var p=new Date(dt);p.setDate(p.getDate()-1);while(dow(p)===0||dow(p)===6||isHoliday(p))p.setDate(p.getDate()-1);return 'Order by: '+p.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' by 2:00 PM';},
   items:[{n:'Beef Strip Steak 8oz',u:'CS'},{n:'Chicken Thighs Boneless Skinless 4x10LB',u:'CS'},{n:'Pork Back Fat Skinned 50LB',u:'CS'}]}
];
function gv(id){for(var i=0;i<V.length;i++)if(V[i].id===id)return V[i];return null;}

var ML={email:'Gmail',sms:'Text Message',line:'LINE'};
var MB={email:'badge-email',sms:'badge-sms',line:'badge-line'};
var data=null,msg='',sender=null;

var SENDERS=[
  {key:'aki',  label:'Aki',   email:'aki@teppei-usa.com'},
  {key:'kacee',label:'Kacee', email:'kacee@teppei-usa.com'},
  {key:'shaine',label:'Shaine',email:'shaine@teppei-usa.com'}
];

function init(){
  var params=new URLSearchParams(window.location.search);
  var raw=params.get('d');
  if(!raw){window.location.href='index.html';return;}
  try{data=JSON.parse(raw);}catch(err){window.location.href='index.html';return;}
  var v=gv(data.vendorId);
  if(!v){window.location.href='index.html';return;}

  document.getElementById('os-vendor').textContent=v.name;
  document.getElementById('os-date').textContent='Delivery: '+data.dateStr;
  var dlEl=document.getElementById('os-deadline');
  if(!v.tbd){
    try{
      var sd=new Date(data.dateStr);
      var dl=v.dl(sd);
      if(dl){
        dlEl.textContent=dl;
        var now=new Date();
        var m=dl.match(/by (\d+):(\d+) (AM|PM)/);
        if(m){
          var hh=parseInt(m[1]);if(m[3]==='PM'&&hh!==12)hh+=12;if(m[3]==='AM'&&hh===12)hh=0;
          var dlD=new Date(sd);dlD.setHours(hh,parseInt(m[2]),0,0);
          var diff=(dlD-now)/3600000;
          dlEl.className='os-deadline '+(diff<2?'dl-urgent':diff<24?'dl-soon':'dl-ok');
        }
      }
    }catch(e){}
  }

  renderSenderBtns();
  buildMsg(v,null);
  renderSend(v);
}

function renderSenderBtns(){
  var h='';
  for(var i=0;i<SENDERS.length;i++){
    var s=SENDERS[i];
    h+='<button class="sender-btn" id="sb'+s.key+'" onclick="selSender(\''+s.key+'\')">'+s.label+'</button>';
  }
  document.getElementById('senderRow').innerHTML=h;
}

function selSender(key){
  sender=key;
  document.querySelectorAll('.sender-btn').forEach(function(b){b.classList.remove('selected');});
  document.getElementById('sb'+key).classList.add('selected');
  var hint=document.getElementById('senderHint');
  if(hint)hint.style.display='none';
  var v=gv(data.vendorId);
  buildMsg(v,key);
  renderSend(v);
}

function getSenderObj(){
  if(!sender)return null;
  for(var i=0;i<SENDERS.length;i++)if(SENDERS[i].key===sender)return SENDERS[i];
  return null;
}

function pluralUnit(u, q){
  if(q<=1)return u;
  var plural={'BAG':'BAGS','BOX':'BOXES','BTL':'BTLS','CTN':'CTNS','CRTN':'CRTNS','LB':'LBS'};
  return plural[u]||u;
}
function buildMsg(v,senderKey){
  var lines=[];
  for(var i=0;i<data.items.length;i++){
    var it=data.items[i];
    lines.push('  - '+it.n+' x '+it.q+' '+pluralUnit(it.u, it.q));
  }
  var sObj=null;
  if(senderKey){for(var i=0;i<SENDERS.length;i++)if(SENDERS[i].key===senderKey){sObj=SENDERS[i];break;}}
  var sep='================================';
  var b='Hi '+v.short+',\n\n';
  b+=sep+'\n';
  b+='DELIVERY: '+data.dateStr.toUpperCase()+'\n';
  if(data.flex)b+='** SPECIAL SCHEDULE REQUEST - please confirm availability **\n';
  b+=sep+'\n\n';
  b+=(lines.length?lines.join('\n'):'  (No items selected)');
  if(data.note)b+='\n\nNote: '+data.note;
  b+='\n\nReceiving Hours: 10:00 AM - 8:00 PM';
  b+='\n\nPlease confirm receipt. Thank you!\n\nBest regards,\nSteak Teppei';
  msg=b;
}

function getCC(vendorId){
  var base=EC[vendorId];
  if(!base)return 'aki@teppei-usa.com,kacee@teppei-usa.com,shaine@teppei-usa.com';
  var sObj=getSenderObj();
  if(!sObj)return base.cc;
  return base.cc.split(',').filter(function(e){return e.trim()!==sObj.email;}).join(',');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function renderSend(v){
  var m=v.method;
  var subj='Order Request - Steak Teppei ('+data.dateStr+')';
  document.getElementById('methodBadge').innerHTML=sender?'<span class="send-method-badge '+MB[m]+'">via '+ML[m]+'</span>':'';
  if(!sender){
    document.getElementById('previewArea').innerHTML='<div style="text-align:center;padding:20px 0;font-size:13px;color:var(--text-hint);">Select your name above to preview</div>';
    return;
  }
  var locked=false;
  var copy='<button class="send-btn btn-copy" id="copyBtn" onclick="copyOrder()"'+(locked?' disabled style="opacity:.35;cursor:not-allowed"':'')+'>Copy Order Message</button><div class="copied" id="copiedBadge">Copied to clipboard!</div>';
  var area='';
  if(m==='email'){
    var ec=EC[v.id]||{to:'',cc:'aki@teppei-usa.com,kacee@teppei-usa.com,shaine@teppei-usa.com'};
    var cc=getCC(v.id);
    area='<div class="email-wrap"><div class="email-hdr">';
    area+='<div class="ef"><span class="efl">To</span><span class="efv">'+ec.to+'</span></div>';
    area+='<div class="ef"><span class="efl">CC</span><span class="efv">'+cc.split(',').join(', ')+'</span></div>';
    area+='<div class="ef"><span class="efl">Subject</span><span class="efv">'+subj+'</span></div>';
    area+='</div><div class="email-body">'+esc(msg)+'</div></div>';
    area+='<button class="send-btn btn-email" id="sendBtn" onclick="doSend()"'+(locked?' disabled style="opacity:.35;cursor:not-allowed"':'')+'>Send via Gmail</button>'+copy;
  }else if(m==='sms'){
    area='<div class="sms-wrap"><div class="sms-hdr">To: '+v.short+'</div>';
    area+='<div class="sms-bubble">'+esc(msg)+'</div></div>';
    area+='<button class="send-btn btn-sms" id="sendBtn" onclick="doSend()"'+(locked?' disabled style="opacity:.35;cursor:not-allowed"':'')+'>Send via Text Message</button>'+copy;
  }else{
    area='<div class="line-wrap"><div class="line-top"><span class="line-back">&#8249;</span><span class="line-title">'+v.short+'</span></div>';
    area+='<div class="line-body"><div class="line-bubble">'+esc(msg)+'</div></div></div>';
    area+='<button class="send-btn btn-line" id="sendBtn" onclick="doSend()"'+(locked?' disabled style="opacity:.35;cursor:not-allowed"':'')+'>Select Recipient &amp; Send via LINE</button>'+copy;
  }
  document.getElementById('previewArea').innerHTML=area;
}

function showDone(){
  var v=gv(data.vendorId);
  var wrap=document.createElement('div');
  wrap.className='done-wrap';
  wrap.innerHTML='<div class="done-icon">\u2705</div>'
    +'<div class="done-vendor">'+v.name+'</div>'
    +'<div class="done-date">'+data.dateStr+'</div>'
    +'<div class="done-countdown" id="doneCountdown">Returning to order screen in 3 seconds...</div>';
  var btn=document.createElement('button');
  btn.className='done-btn';
  btn.textContent='New Order';
  btn.onclick=function(){window.location.href='index.html';};
  wrap.appendChild(btn);
  document.querySelector('.app').innerHTML='';
  document.querySelector('.app').appendChild(wrap);
  var sec=3;
  var timer=setInterval(function(){
    sec--;
    var el=document.getElementById('doneCountdown');
    if(!el){clearInterval(timer);return;}
    if(sec<=0){clearInterval(timer);window.location.href='index.html';}
    else el.textContent='Returning to order screen in '+sec+' second'+(sec>1?'s':'')+'...';
  },1000);
}

function doSend(){
  if(!sender){alert('Please select your name first.');return;}
  var v=gv(data.vendorId);
  if(v.method==='email'){
    var ec=EC[v.id]||{to:'',cc:'aki@teppei-usa.com,kacee@teppei-usa.com,shaine@teppei-usa.com'};
    var cc=getCC(v.id);
    var s=encodeURIComponent('Order Request - Steak Teppei ('+data.dateStr+')');
    var body=msg.split('\n').join('\r\n');
    window.location.href='mailto:'+encodeURIComponent(ec.to)+'?cc='+encodeURIComponent(cc)+'&subject='+s+'&body='+encodeURIComponent(body);
  }else if(v.method==='sms'){
    window.location.href='sms:?body='+encodeURIComponent(msg);
  }else{
    var u='https://line.me/R/share?text='+encodeURIComponent(msg);
    window.open(u,'_blank');
  }
  setTimeout(function(){showDone();},300);
}

function copyOrder(){
  if(!sender){alert('Please select your name first.');return;}
  navigator.clipboard.writeText(msg).then(function(){
    showDone();
  }).catch(function(){alert('Copy failed. Please copy manually.');});
}

function goBack(){window.location.href='index.html';}

init();

</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          document.getElementById('updateBanner').classList.add('show');
        }
      });
    });
  });
  var refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!refreshing){refreshing=true;window.location.reload();}
  });
}
function doUpdate(){
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    else window.location.reload();
  });
}
</script>
</body>
</html>

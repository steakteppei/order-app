.deadline-tbd{color:var(--text-hint);font-style:italic;}

.modal-confirm{border:none;color:#fff;}

var ML={email:'Gmail',sms:'Text Message',line:'LINE'};
var MB={email:'badge-email',sms:'badge-sms',line:'badge-line'};
var MM={email:'c-email',sms:'c-sms',line:'c-line'};

var data=null,msg='';

function init(){
  var raw=sessionStorage.getItem('orderData');
  if(!raw){window.location.href='index.html';return;}
  data=JSON.parse(raw);
  var v=gv(data.vendorId);
  if(!v){window.location.href='index.html';return;}

  // Summary bar
  var dl=v&&!v.tbd&&v.dl?v.dl(new Date()):null;
  try{
    var sd=new Date(data.dateStr);
    dl=v&&!v.tbd?v.dl(sd):null;
  }catch(e){}
  document.getElementById('os-vendor').textContent=v.name;
  document.getElementById('os-date').textContent='Delivery: '+data.dateStr;
  var dlEl=document.getElementById('os-deadline');
  dlEl.textContent=dl?dl:'';

  buildMsg(v);
  renderSend(v);
}

function buildMsg(v){
  var lines=[];
  for(var i=0;i<data.items.length;i++){
    var it=data.items[i];
    lines.push('  - '+it.n+' x '+it.q+' '+it.u);
  }
  var b='Hi '+v.short+' Team,\n\n';
  b+='Hope you are doing well. This is Steak Teppei (Teppei USA, Inc.) at Ala Moana Center.\n';
  b+='Please see our order details below:\n\n';
  b+='Requested Delivery Date: '+data.dateStr+'\n';
  if(data.flex){b+='** SPECIAL SCHEDULE REQUEST - please confirm availability **\n';}
  b+='Receiving Hours: 10:00 AM - 8:00 PM\n\n';
  b+='--- Order Details ---\n';
  b+=(lines.length?lines.join('\n'):'  (No items selected)');
  if(data.note)b+='\n\nNote: '+data.note;
  b+='\n\nPlease confirm receipt at your earliest convenience.\nThank you!\n\n';
  b+='Best regards,\nSteak Teppei (Teppei USA, Inc.)\n';
  b+='Makai Market Food Court, Ala Moana Center\n';
  b+='1450 Ala Moana Blvd #1160J, Honolulu, HI 96814\n';
  b+='Tel: (808) 636-4455';
  msg=b;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}

function renderSend(v){
  var m=v.method;
  var subj='Order Request - Steak Teppei ('+data.dateStr+')';
  document.getElementById('methodBadge').innerHTML='<span class="send-method-badge '+MB[m]+'">via '+ML[m]+'</span>';
  var copy='<button class="send-btn btn-copy" onclick="copyOrder()">Copy Order Message</button><div class="copied" id="copiedBadge">Copied to clipboard!</div>';
  var area='';
  if(m==='email'){
    var ec=EC[v.id]||{to:'',cc:'aki@teppei-usa.com,kacee@teppei-usa.com,shaine@teppei-usa.com'};
    area='<div class="email-wrap"><div class="email-hdr">';
    area+='<div class="ef"><span class="efl">To</span><span class="efv">'+ec.to+'</span></div>';
    area+='<div class="ef"><span class="efl">CC</span><span class="efv">'+ec.cc.split(',').join(', ')+'</span></div>';
    area+='<div class="ef"><span class="efl">Subject</span><span class="efv">'+subj+'</span></div>';
    area+='</div><div class="email-body">'+esc(msg)+'</div></div>';
    area+='<button class="send-btn btn-email" onclick="confirmSend()">Review &amp; Send via Gmail</button>'+copy;
  }else if(m==='sms'){
    area='<div class="sms-wrap"><div class="sms-hdr">To: '+v.short+'</div>';
    area+='<div class="sms-bubble">'+esc(msg)+'</div></div>';
    area+='<button class="send-btn btn-sms" onclick="confirmSend()">Review &amp; Send via Text Message</button>'+copy;
  }else{
    area='<div class="line-wrap"><div class="line-top"><span class="line-back">&#8249;</span><span class="line-title">'+v.short+'</span></div>';
    area+='<div class="line-body"><div class="line-bubble">'+esc(msg)+'</div></div></div>';
    area+='<button class="send-btn btn-line" onclick="confirmSend()">Select Recipient &amp; Send via LINE</button>'+copy;
  }
  document.getElementById('previewArea').innerHTML=area;
}

function confirmSend(){
  var v=gv(data.vendorId);
  document.getElementById('modal-vendor').textContent=v.name;
  document.getElementById('modal-date').textContent='Delivery Date: '+data.dateStr;
  var sd=new Date(data.dateStr);
  var dl=v&&!v.tbd?v.dl(sd):'';
  document.getElementById('modal-deadline').textContent=dl||'';
  document.getElementById('modal-flex-note').style.display=data.flex?'block':'none';
  var h='';
  for(var i=0;i<data.items.length;i++){
    var it=data.items[i];
    h+='<div class="modal-item"><span>'+it.n+'</span><span class="modal-item-qty">'+it.q+' '+it.u+'</span></div>';
  }
  document.getElementById('modal-items').innerHTML=h||'<div class="modal-no-items">No items.</div>';
  var nd=document.getElementById('modal-note-display');
  if(data.note){nd.style.display='block';nd.textContent='Note: '+data.note;}else nd.style.display='none';
  document.getElementById('modal-via-label').textContent=ML[v.method];
  document.getElementById('modal-confirm-btn').className='modal-confirm '+MM[v.method];
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}

function executeSend(){
  closeModal();
  var v=gv(data.vendorId);
  if(v.method==='email'){
    var ec=EC[v.id]||{to:'',cc:'aki@teppei-usa.com,kacee@teppei-usa.com,shaine@teppei-usa.com'};
    var s=encodeURIComponent('Order Request - Steak Teppei ('+data.dateStr+')');
    var body=msg.split('\n').join('\r\n');
    window.location.href='mailto:'+encodeURIComponent(ec.to)+'?cc='+encodeURIComponent(ec.cc)+'&subject='+s+'&body='+encodeURIComponent(body);
  }else if(v.method==='sms'){
    window.location.href='sms:?body='+encodeURIComponent(msg);
  }else{
    var u='https://social-plugins.line.me/lineit/share?url='+encodeURIComponent('https://steakteppei.github.io/order-app/')+'&text='+encodeURIComponent(msg);
    window.open(u,'_blank');
  }
}

function copyOrder(){
  navigator.clipboard.writeText(msg).then(function(){
    var b=document.getElementById('copiedBadge');
    if(b){b.style.display='block';setTimeout(function(){b.style.display='none';},2500);}
  }).catch(function(){alert('Copy failed. Please copy manually.');});
}

function goBack(){
  window.location.href='index.html';
}

init();

</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          document.getElementById('updateBanner').classList.add('show');
        }
      });
    });
  });
  var refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!refreshing){refreshing=true;window.location.reload();}
  });
}
function doUpdate(){
  navigator.serviceWorker.getRegistration().then(function(reg){
    if(reg&&reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    else window.location.reload();
  });
}
</script>
</body>
</html>

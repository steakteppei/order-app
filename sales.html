<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Steak Teppei — Sales</title>
<style>
:root{
  --bg:#f5f4f2;--card:#fff;--border:rgba(0,0,0,.08);--border-md:rgba(0,0,0,.14);
  --text:#1a1a1a;--text-sub:#555;--text-hint:#999;
  --radius:16px;--radius-sm:10px;
  --orange:#E8440A;--orange-light:#fff2ed;
  --green:#166534;--green-light:#f0fdf4;
  --blue:#1a56db;--blue-light:#ebf1ff;
  --purple:#7c3aed;--purple-light:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:var(--text);min-height:100vh;}
.header{background:var(--card);border-bottom:.5px solid var(--border);padding:16px 16px 0;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:0 4px 0 0;line-height:1;}
.header-title{font-size:17px;font-weight:700;}
.header-sub{font-size:11px;color:var(--text-hint);margin-top:1px;}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-hint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.content{padding:16px;}
.section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
.section-sub{font-size:11px;color:var(--text-hint);margin-top:2px;font-weight:400;}
.loading{text-align:center;padding:40px;color:var(--text-hint);font-size:13px;}
.error{text-align:center;padding:40px;color:#dc2626;font-size:13px;}

/* Bar chart */
.chart-wrap{overflow-x:auto;}
.bar-chart{display:flex;flex-direction:column;gap:8px;min-width:0;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{font-size:11px;color:var(--text-sub);width:90px;flex-shrink:0;text-align:right;line-height:1.3;}
.bar-track{flex:1;background:var(--bg);border-radius:4px;height:22px;position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.bar-fill.orange{background:var(--orange);}
.bar-fill.blue{background:var(--blue);}
.bar-fill.green{background:#16a34a;}
.bar-fill.purple{background:var(--purple);}
.bar-val{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.bar-val-out{font-size:10px;color:var(--text-hint);margin-left:4px;}

/* Line chart */
.line-chart-wrap{position:relative;height:160px;margin:8px 0 20px;}
canvas{width:100%!important;}

/* Busy period cards */
.period-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.period-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px;}
.period-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px;}
.period-years{display:flex;flex-direction:column;gap:3px;}
.period-year-row{display:flex;justify-content:space-between;align-items:center;}
.period-year{font-size:10px;color:var(--text-hint);}
.period-rev{font-size:12px;font-weight:700;color:var(--orange);}
.period-avg{font-size:10px;color:var(--text-sub);}
.period-bar-wrap{margin-top:4px;}
.period-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.period-bar-fill{height:100%;background:var(--orange);border-radius:2px;}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;padding:6px 8px;color:var(--text-hint);font-weight:600;border-bottom:.5px solid var(--border-md);font-size:11px;}
.data-table td{padding:7px 8px;border-bottom:.5px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums;}
.data-table .rev{color:var(--orange);font-weight:600;}

/* Summary row */
.summary-row{display:flex;gap:8px;margin-bottom:12px;}
.summary-card{flex:1;background:var(--bg);border-radius:var(--radius-sm);padding:10px;}
.summary-label{font-size:10px;color:var(--text-hint);margin-bottom:3px;}
.summary-val{font-size:15px;font-weight:700;color:var(--text);}
.summary-val.orange{color:var(--orange);}

.updated{text-align:center;font-size:10px;color:var(--text-hint);padding:8px 0 20px;opacity:.6;}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <button class="back-btn" onclick="window.location.href='index.html'">&#8249;</button>
    <div>
      <div class="header-title">Sales Data</div>
      <div class="header-sub">Powered by Clover</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('busy')">Busy Periods</div>
    <div class="tab" onclick="showTab('daily')">Daily Sales</div>
    <div class="tab" onclick="showTab('hourly')">By Hour</div>
    <div class="tab" onclick="showTab('items')">Items</div>
  </div>
</div>

<div class="content">
  <div id="tab-busy"></div>
  <div id="tab-daily" style="display:none"></div>
  <div id="tab-hourly" style="display:none"></div>
  <div id="tab-items" style="display:none"></div>
  <div class="updated" id="updatedLabel"></div>
</div>

<script>
var SHEET_ID = '1syr0EeXr5d6mRzE-VlzIFe-zDOaAhnFGau5bPg-leNQ';
var BASE = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=';

var cache = {};
var activeTab = 'busy';

function showTab(name) {
  activeTab = name;
  ['busy','daily','hourly','items'].forEach(function(t) {
    document.getElementById('tab-'+t).style.display = t===name ? '' : 'none';
    document.querySelectorAll('.tab').forEach(function(el,i) {
      el.classList.toggle('active', ['busy','daily','hourly','items'][i]===name);
    });
  });
  renderTab(name);
}

function parseGvizDate(val) {
  if (!val) return '';
  var s = val.toString();
  var dm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (dm) {
    var y=parseInt(dm[1]),mo=parseInt(dm[2])+1,d=parseInt(dm[3]);
    return y+'-'+(mo<10?'0':'')+mo+'-'+(d<10?'0':'')+d;
  }
  return s.substring(0,10);
}

function loadSheet(sheetName, cb) {
  if (cache[sheetName]) { cb(cache[sheetName]); return; }
  fetch(BASE + encodeURIComponent(sheetName))
    .then(function(r){ return r.text(); })
    .then(function(text) {
      var s1=text.indexOf('('),s2=text.lastIndexOf(')');var json=JSON.parse(s1>=0?text.substring(s1+1,s2+1>s1+1?s2:text.length):text);
      var rows = json.table.rows.map(function(r) {
        return r.c.map(function(c){ return c ? (c.v !== null && c.v !== undefined ? c.v : '') : ''; });
      });
      cache[sheetName] = rows;
      cb(rows);
    })
    .catch(function(){ cb([]); });
}

function renderTab(name) {
  var el = document.getElementById('tab-'+name);
  if (name === 'busy') {
    el.innerHTML = '<div class="loading">Loading...</div>';
    loadSheet('Daily Sales', function(rows) { renderBusy(rows); });
    return;
  }
  if (cache[name]) { renderContent(name, cache[name]); return; }
  el.innerHTML = '<div class="loading">Loading...</div>';
  var sheetName = {daily:'Daily Sales',hourly:'Hourly Sales',items:'Item Sales'}[name];
  loadSheet(sheetName, function(rows) {
    if (!rows.length) {
      el.innerHTML = '<div class="error">Failed to load data.<br>Make sure the spreadsheet is public.</div>';
      return;
    }
    cache[name] = rows;
    renderContent(name, rows);
  });
}

function fmt$(n) {
  n = parseFloat(n);
  if (isNaN(n)) return '$0';
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0});
}
function fmtK(n) {
  n = parseFloat(n);
  if (isNaN(n)) return '$0';
  if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}

// ── BUSY PERIODS ──
function renderContent(name, rows) {
  if (name === 'busy') renderBusy(rows);
  else if (name === 'daily') renderDaily(rows);
  else if (name === 'hourly') renderHourly(rows);
  else if (name === 'items') renderItems(rows);
}

function renderBusy(dailyRows) {
  var el = document.getElementById('tab-busy');

  var dayMap = {};
  dailyRows.forEach(function(r) {
    var key = parseGvizDate(r[0]);
    if (!key) return;
    dayMap[key] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });

  var PERIODS = [
    { name: 'Golden Week',       ranges: [['2024-04-29','2024-05-06'],['2025-04-29','2025-05-06'],['2026-04-29','2026-05-06']] },
    { name: 'Obon',              ranges: [['2024-08-11','2024-08-16'],['2025-08-11','2025-08-16'],['2026-08-11','2026-08-16']] },
    { name: 'Silver Week',       ranges: [['2024-09-19','2024-09-23'],['2025-09-19','2025-09-23']] },
    { name: 'New Year Holiday',  ranges: [['2023-12-26','2024-01-04'],['2024-12-26','2025-01-04'],['2025-12-26','2026-01-04']] },
    { name: 'Memorial Day',      ranges: [['2024-05-25','2024-05-27'],['2025-05-23','2025-05-26'],['2026-05-23','2026-05-25']] },
    { name: 'Labor Day',         ranges: [['2024-08-31','2024-09-02'],['2025-08-30','2025-09-01'],['2026-09-05','2026-09-07']] },
    { name: 'Thanksgiving',      ranges: [['2024-11-28','2024-12-01'],['2025-11-27','2025-11-30']] },
    { name: 'Honolulu Marathon', ranges: [['2024-12-07','2024-12-09'],['2025-12-06','2025-12-08'],['2026-12-11','2026-12-13']] },
    { name: 'Spring Break HI',   ranges: [['2024-03-18','2024-03-22'],['2025-03-17','2025-03-21'],['2026-03-23','2026-03-27']] },
    { name: 'Independence Day',  ranges: [['2024-07-04','2024-07-07'],['2025-07-04','2025-07-07'],['2026-07-03','2026-07-06']] }
  ];

  function sumRange(start, end) {
    var d = new Date(start+'T12:00:00'), endD = new Date(end+'T12:00:00');
    var rev=0, orders=0, days=0;
    while (d <= endD) {
      var y=d.getFullYear(), mo=d.getMonth()+1, dd=d.getDate();
      var key=y+'-'+(mo<10?'0':'')+mo+'-'+(dd<10?'0':'')+dd;
      var v = dayMap[key];
      if (v && v.orders > 0) { rev += v.rev; orders += v.orders; }
      days++;
      d.setDate(d.getDate()+1);
    }
    return { rev:rev, orders:orders, days:days, avg: days>0 ? rev/days : 0 };
  }

  var today = new Date();
  var allEntries = [];
  PERIODS.forEach(function(p) {
    p.ranges.forEach(function(range) {
      var isFuture = new Date(range[1]+'T12:00:00') > today;
      var year = range[0].substring(0,4);
      var data = isFuture ? null : sumRange(range[0], range[1]);
      allEntries.push({ name:p.name, year:year, data:data, isFuture:isFuture });
    });
  });

  var maxRev = 0;
  allEntries.forEach(function(e){ if(e.data && e.data.rev > maxRev) maxRev = e.data.rev; });

  var grouped = {}, groupOrder = [];
  allEntries.forEach(function(e) {
    if (!grouped[e.name]) { grouped[e.name] = []; groupOrder.push(e.name); }
    grouped[e.name].push(e);
  });

  var html = '<div class="section"><div class="section-title">繁忙期 売上比較 <span class="section-sub">Revenue by busy period</span></div>';
  html += '<div class="period-grid">';
  groupOrder.forEach(function(name) {
    var entries = grouped[name];
    html += '<div class="period-card"><div class="period-name">'+name+'</div><div class="period-years">';
    entries.forEach(function(e) {
      if (e.isFuture) {
        html += '<div class="period-year-row"><span class="period-year">'+e.year+'</span><span class="period-rev" style="color:var(--text-hint);font-size:10px;">Upcoming</span></div>';
        return;
      }
      var pct = maxRev > 0 ? Math.round(e.data.rev/maxRev*100) : 0;
      html += '<div class="period-year-row"><span class="period-year">'+e.year+'</span><span class="period-rev">'+fmtK(e.data.rev)+'</span></div>';
      html += '<div class="period-bar-wrap"><div class="period-bar"><div class="period-bar-fill" style="width:'+pct+'%"></div></div></div>';
      html += '<div class="period-avg">'+fmt$(e.data.avg)+'/day &middot; '+e.data.orders+' orders</div>';
    });
    html += '</div></div>';
  });
  html += '</div></div>';

  var ranked = allEntries.filter(function(e){ return !e.isFuture && e.data && e.data.orders > 0; });
  ranked.sort(function(a,b){ return b.data.avg - a.data.avg; });
  ranked = ranked.slice(0,15);
  var maxAvg = ranked[0] ? ranked[0].data.avg : 1;
  html += '<div class="section"><div class="section-title">Avg Revenue per Day &mdash; Top 15</div><div class="bar-chart">';
  ranked.forEach(function(e) {
    var pct = Math.round(e.data.avg/maxAvg*100);
    var label = e.name.replace('Holiday','Hol.').replace('Weekend','Wknd') + " '" + e.year.substring(2);
    html += '<div class="bar-row">'
      + '<div class="bar-label" style="width:110px;font-size:10px;">'+label+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%"><span class="bar-val">'+fmtK(e.data.avg)+'</span></div></div>'
      + '</div>';
  });
  html += '</div></div>';
  el.innerHTML = html;
}

// ── DAILY SALES ──
function renderDaily(rows) {
  var el = document.getElementById('tab-daily');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  // Last 30 days
  var last30 = rows.slice(-30);
  var totalRev = 0, totalOrders = 0;
  rows.forEach(function(r){ totalRev += parseFloat(r[1])||0; totalOrders += parseInt(r[2])||0; });

  var html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-label">Total Revenue</div><div class="summary-val orange">'+fmt$(totalRev)+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">Total Orders</div><div class="summary-val">'+totalOrders.toLocaleString()+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">Avg Ticket</div><div class="summary-val">'+fmt$(totalRev/totalOrders)+'</div></div>'
    + '</div>';

  // Bar chart last 30 days
  html += '<div class="section"><div class="section-title">Last 30 Days</div><div class="bar-chart">';
  var maxRev = 0;
  last30.forEach(function(r){ var v=parseFloat(r[1])||0; if(v>maxRev) maxRev=v; });
  last30.forEach(function(r) {
    var date = r[0] ? parseGvizDate(r[0]).substring(5) : '';
    var rev = parseFloat(r[1])||0;
    var pct = maxRev > 0 ? Math.round(rev/maxRev*100) : 0;
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+date+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%">'
      + (pct > 15 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 15 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  // Table
  html += '<div class="section"><div class="section-title">All Data</div>'
    + '<table class="data-table"><tr><th>Date</th><th class="num">Revenue</th><th class="num">Orders</th><th class="num">Avg</th></tr>';
  rows.slice().reverse().forEach(function(r) {
    html += '<tr><td>'+r[0]+'</td><td class="num rev">'+fmt$(r[1])+'</td><td class="num">'+r[2]+'</td><td class="num">'+fmt$(r[3])+'</td></tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}

// ── HOURLY SALES ──
function renderHourly(rows) {
  var el = document.getElementById('tab-hourly');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  var maxRev = 0;
  rows.forEach(function(r){ var v=parseFloat(r[1])||0; if(v>maxRev) maxRev=v; });

  // Find peak hours
  var sorted = rows.slice().sort(function(a,b){ return (parseFloat(b[1])||0)-(parseFloat(a[1])||0); });
  var peak = sorted.slice(0,3).filter(function(r){ return parseFloat(r[1])>0; });

  var html = '<div class="section"><div class="section-title">Peak Hours</div><div class="summary-row">';
  peak.forEach(function(r,i) {
    html += '<div class="summary-card"><div class="summary-label">#'+(i+1)+' '+r[0]+'</div><div class="summary-val orange">'+fmt$(r[1])+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="section"><div class="section-title">Avg Revenue by Hour</div><div class="bar-chart">';
  rows.forEach(function(r) {
    var rev = parseFloat(r[1])||0;
    if (rev === 0) return;
    var pct = maxRev > 0 ? Math.round(rev/maxRev*100) : 0;
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+r[0]+'</div>'
      + '<div class="bar-track"><div class="bar-fill blue" style="width:'+pct+'%">'
      + (pct > 15 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 15 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  el.innerHTML = html;
}

// ── ITEM SALES ──
function renderItems(rows) {
  var el = document.getElementById('tab-items');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  var top = rows.slice(0, 20);
  var maxRev = parseFloat(top[0][2])||1;
  var totalRev = 0;
  rows.forEach(function(r){ totalRev += parseFloat(r[2])||0; });

  var html = '<div class="section"><div class="section-title">Top Items by Revenue</div><div class="bar-chart">';
  top.forEach(function(r, i) {
    var rev = parseFloat(r[2])||0;
    if (rev === 0) return;
    var pct = Math.round(rev/maxRev*100);
    var colors = ['orange','orange','orange','blue','blue','blue','green','green','green','purple'];
    var color = colors[Math.min(i, colors.length-1)];
    html += '<div class="bar-row">'
      + '<div class="bar-label" style="font-size:10px;line-height:1.2;">'+r[0]+'</div>'
      + '<div class="bar-track"><div class="bar-fill '+color+'" style="width:'+pct+'%">'
      + (pct > 20 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 20 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  html += '<div class="section"><div class="section-title">All Items</div>'
    + '<table class="data-table"><tr><th>Item</th><th class="num">Qty</th><th class="num">Revenue</th></tr>';
  rows.forEach(function(r) {
    html += '<tr><td>'+r[0]+'</td><td class="num">'+parseInt(r[1]).toLocaleString()+'</td><td class="num rev">'+fmt$(r[2])+'</td></tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}

// Init
document.getElementById('updatedLabel').textContent = 'Data updated daily at 3:00 AM';
renderTab('busy');
</script>
</body>
</html>

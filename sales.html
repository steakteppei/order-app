<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Steak Teppei — Sales</title>
<style>
:root{
  --bg:#f5f4f2;--card:#fff;--border:rgba(0,0,0,.08);--border-md:rgba(0,0,0,.14);
  --text:#1a1a1a;--text-sub:#555;--text-hint:#999;
  --radius:16px;--radius-sm:10px;
  --orange:#E8440A;--orange-light:#fff2ed;
  --green:#166534;--green-light:#f0fdf4;
  --blue:#1a56db;--blue-light:#ebf1ff;
  --purple:#7c3aed;--purple-light:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:var(--text);min-height:100vh;}
.header{background:var(--card);border-bottom:.5px solid var(--border);padding:16px 16px 0;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.back-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:0 4px 0 0;line-height:1;}
.header-title{font-size:17px;font-weight:700;}
.header-sub{font-size:11px;color:var(--text-hint);margin-top:1px;}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-hint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.content{padding:16px;}
.section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;}
.section-sub{font-size:11px;color:var(--text-hint);margin-top:2px;font-weight:400;}
.loading{text-align:center;padding:40px;color:var(--text-hint);font-size:13px;}
.error{text-align:center;padding:40px;color:#dc2626;font-size:13px;}

/* Bar chart */
.chart-wrap{overflow-x:auto;}
.bar-chart{display:flex;flex-direction:column;gap:8px;min-width:0;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{font-size:11px;color:var(--text-sub);width:90px;flex-shrink:0;text-align:right;line-height:1.3;}
.bar-track{flex:1;background:var(--bg);border-radius:4px;height:22px;position:relative;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
.bar-fill.orange{background:var(--orange);}
.bar-fill.blue{background:var(--blue);}
.bar-fill.green{background:#16a34a;}
.bar-fill.purple{background:var(--purple);}
.bar-val{font-size:10px;font-weight:700;color:#fff;white-space:nowrap;}
.bar-val-out{font-size:10px;color:var(--text-hint);margin-left:4px;}

/* Line chart */
.line-chart-wrap{position:relative;height:160px;margin:8px 0 20px;}
canvas{width:100%!important;}

/* Busy period cards */
.period-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.period-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px;}
.period-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px;}
.period-years{display:flex;flex-direction:column;gap:3px;}
.period-year-row{display:flex;justify-content:space-between;align-items:center;}
.period-year{font-size:10px;color:var(--text-hint);}
.period-rev{font-size:12px;font-weight:700;color:var(--orange);}
.period-avg{font-size:10px;color:var(--text-sub);}
.period-bar-wrap{margin-top:4px;}
.period-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.period-bar-fill{height:100%;background:var(--orange);border-radius:2px;}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px;}
.data-table th{text-align:left;padding:6px 8px;color:var(--text-hint);font-weight:600;border-bottom:.5px solid var(--border-md);font-size:11px;}
.data-table td{padding:7px 8px;border-bottom:.5px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums;}
.data-table .rev{color:var(--orange);font-weight:600;}

/* Summary row */
.summary-row{display:flex;gap:8px;margin-bottom:12px;}
.summary-card{flex:1;background:var(--bg);border-radius:var(--radius-sm);padding:10px;}
.summary-label{font-size:10px;color:var(--text-hint);margin-bottom:3px;}
.summary-val{font-size:15px;font-weight:700;color:var(--text);}
.summary-val.orange{color:var(--orange);}

.updated{text-align:center;font-size:10px;color:var(--text-hint);padding:8px 0 20px;opacity:.6;}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <button class="back-btn" onclick="window.location.href='index.html'">&#8249;</button>
    <div>
      <div class="header-title">Sales Data</div>
      <div class="header-sub">Powered by Clover</div>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('busy')">Busy Periods</div>
    <div class="tab" onclick="showTab('seasonal')">Seasonal</div>
    <div class="tab" onclick="showTab('weather')">☁️ Weather</div>
    <div class="tab" onclick="showTab('daily')">Daily Sales</div>
    <div class="tab" onclick="showTab('monthly')">Monthly</div>
    <div class="tab" onclick="showTab('yearly')">Yearly</div>
    <div class="tab" onclick="showTab('hourly')">By Hour</div>
    <div class="tab" onclick="showTab('items')">Items</div>
  </div>
</div>

<div class="content">
  <div id="tab-busy"></div>
  <div id="tab-seasonal" style="display:none"></div>
  <div id="tab-weather" style="display:none"></div>
  <div id="tab-daily" style="display:none"></div>
  <div id="tab-monthly" style="display:none"></div>
  <div id="tab-yearly" style="display:none"></div>
  <div id="tab-hourly" style="display:none"></div>
  <div id="tab-items" style="display:none"></div>
  <div class="updated" id="updatedLabel"></div>
</div>

<script>
var SHEET_ID = '1syr0EeXr5d6mRzE-VlzIFe-zDOaAhnFGau5bPg-leNQ';
var BASE = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=';

var cache = {};
var activeTab = 'busy';

function showTab(name) {
  activeTab = name;
  ['busy','seasonal','weather','daily','monthly','yearly','hourly','items'].forEach(function(t) {
    document.getElementById('tab-'+t).style.display = t===name ? '' : 'none';
    document.querySelectorAll('.tab').forEach(function(el,i) {
      el.classList.toggle('active', ['busy','seasonal','weather','daily','monthly','yearly','hourly','items'][i]===name);
    });
  });
  renderTab(name);
}

function parseGvizDate(val) {
  if (!val) return '';
  var s = val.toString();
  var dm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (dm) {
    var y=parseInt(dm[1]),mo=parseInt(dm[2])+1,d=parseInt(dm[3]);
    return y+'-'+(mo<10?'0':'')+mo+'-'+(d<10?'0':'')+d;
  }
  return s.substring(0,10);
}

function loadSheet(sheetName, cb) {
  if (cache[sheetName]) { cb(cache[sheetName]); return; }
  fetch(BASE + encodeURIComponent(sheetName))
    .then(function(r){ return r.text(); })
    .then(function(text) {
      var s1=text.indexOf('('),s2=text.lastIndexOf(')');var json=JSON.parse(s1>=0?text.substring(s1+1,s2+1>s1+1?s2:text.length):text);
      var rows = json.table.rows.map(function(r) {
        return r.c.map(function(c){ return c ? (c.v !== null && c.v !== undefined ? c.v : '') : ''; });
      });
      cache[sheetName] = rows;
      cb(rows);
    })
    .catch(function(){ cb([]); });
}

function renderTab(name) {
  var el = document.getElementById('tab-'+name);
  if (name === 'busy') {
    el.innerHTML = '<div class="loading">Loading...</div>';
    loadSheet('Daily Sales', function(rows) { renderBusy(rows); });
    return;
  }
  if (name === 'seasonal') {
    el.innerHTML = '<div class="loading">Loading...</div>';
    loadSheet('Daily Sales', function(rows) { renderSeasonal(rows); });
    return;
  }
  if (name === 'weather') {
    el.innerHTML = '<div class="loading">Loading weather & sales data...</div>';
    loadSheet('Daily Sales', function(rows) { renderWeatherCorrelation(rows); });
    return;
  }
  if (cache[name]) { renderContent(name, cache[name]); return; }
  el.innerHTML = '<div class="loading">Loading...</div>';
  if (name === 'monthly' || name === 'yearly') {
    el.innerHTML = '<div class="loading">Loading...</div>';
    loadSheet('Daily Sales', function(rows) {
      if (name === 'monthly') renderMonthly(rows);
      else renderYearly(rows);
    });
    return;
  }
  var sheetName = {daily:'Daily Sales',hourly:'Hourly Sales',items:'Item Sales'}[name];
  loadSheet(sheetName, function(rows) {
    if (!rows.length) {
      el.innerHTML = '<div class="error">Failed to load data.<br>Make sure the spreadsheet is public.</div>';
      return;
    }
    cache[name] = rows;
    renderContent(name, rows);
  });
}

function fmt$(n) {
  n = parseFloat(n);
  if (isNaN(n)) return '$0';
  return '$' + n.toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0});
}
function fmtK(n) {
  n = parseFloat(n);
  if (isNaN(n)) return '$0';
  if (n >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}

// ── BUSY PERIODS ──
function renderContent(name, rows) {
  if (name === 'busy') renderBusy(rows);
  else if (name === 'daily') renderDaily(rows);
  else if (name === 'hourly') renderHourly(rows);
  else if (name === 'items') renderItems(rows);
}

function fmtDateRange(start, end) {
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var s = new Date(start+'T12:00:00'), e = new Date(end+'T12:00:00');
  var sm = months[s.getMonth()], sd = s.getDate();
  var em = months[e.getMonth()], ed = e.getDate();
  if (sm === em) return sm+' '+sd+'–'+ed;
  return sm+' '+sd+' – '+em+' '+ed;
}

function renderBusy(dailyRows) {
  var el = document.getElementById('tab-busy');

  var dayMap = {};
  dailyRows.forEach(function(r) {
    var key = parseGvizDate(r[0]);
    if (!key) return;
    dayMap[key] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });

  var PERIODS = [
    // ── Winter Peak Season（ハワイ最繁忙期：12月中旬〜3月末） ──
    { name: 'Winter Peak Season', ranges: [
      ['2023-12-15','2024-01-05'],
      ['2024-12-15','2025-01-05'],
      ['2025-12-15','2026-01-04']
    ]},
    // ── US Spring Break（本土スプリングブレーク：3月〜4月上旬） ──
    { name: 'US Spring Break', ranges: [
      ['2024-03-09','2024-04-14'],
      ['2025-03-08','2025-04-13'],
      ['2026-03-14','2026-04-12']
    ]},
    // ── Valentine's & Presidents Day（2月の繁忙期） ──
    { name: "Valentine's & Presidents Day", ranges: [
      ['2024-02-10','2024-02-19'],
      ['2025-02-13','2025-02-17'],
      ['2026-02-12','2026-02-16']
    ]},
    // ── Golden Week（日本GW） ──
    { name: 'Golden Week', ranges: [
      ['2024-04-27','2024-05-06'],
      ['2025-04-29','2025-05-06'],
      ['2026-04-29','2026-05-06']
    ]},
    // ── Memorial Day ──
    { name: 'Memorial Day', ranges: [
      ['2024-05-25','2024-05-27'],
      ['2025-05-23','2025-05-26'],
      ['2026-05-23','2026-05-25']
    ]},
    // ── US Summer（6〜8月：年間最多訪問者月） ──
    { name: 'US Summer Break', ranges: [
      ['2024-06-08','2024-08-18'],
      ['2025-06-07','2025-08-17'],
      ['2026-06-06','2026-08-16']
    ]},
    // ── Independence Day ──
    { name: 'Independence Day', ranges: [
      ['2024-07-04','2024-07-07'],
      ['2025-07-04','2025-07-07'],
      ['2026-07-03','2026-07-06']
    ]},
    // ── Obon（お盆） ──
    { name: 'Obon', ranges: [
      ['2024-08-10','2024-08-18'],
      ['2025-08-11','2025-08-17'],
      ['2026-08-10','2026-08-17']
    ]},
    // ── Labor Day ──
    { name: 'Labor Day', ranges: [
      ['2024-08-31','2024-09-02'],
      ['2025-08-30','2025-09-01'],
      ['2026-09-05','2026-09-07']
    ]},
    // ── September Holidays（シルバーウィーク期間）──
    // 2024: 3連休×2回（9/14-16, 9/21-23）
    // 2025: 3連休1回（9/13-15）飛び石（9/20-23）
    // 2026: 5連休（9/19-23）11年ぶり大型SW
    { name: 'Silver Week', ranges: [
      ['2024-09-14','2024-09-23'],
      ['2025-09-13','2025-09-23'],
      ['2026-09-19','2026-09-23']
    ]},
    // ── Thanksgiving ──
    { name: 'Thanksgiving', ranges: [
      ['2024-11-28','2024-12-01'],
      ['2025-11-27','2025-11-30'],
      ['2026-11-26','2026-11-29']
    ]},
    // ── Honolulu Marathon（毎年12月第2日曜） ──
    { name: 'Honolulu Marathon', ranges: [
      ['2024-12-07','2024-12-09'],
      ['2025-12-06','2025-12-08'],
      ['2026-12-11','2026-12-13']
    ]},
    // ── Christmas Week ──
    { name: 'Christmas Week', ranges: [
      ['2023-12-22','2023-12-26'],
      ['2024-12-22','2024-12-26'],
      ['2025-12-22','2025-12-26']
    ]},
    // ── Hawaii Spring Break（HIDOE） ──
    { name: 'Spring Break HI', ranges: [
      ['2024-03-18','2024-03-22'],
      ['2025-03-17','2025-03-21'],
      ['2026-03-23','2026-03-27']
    ]}
  ];

  function sumRange(start, end) {
    var d = new Date(start+'T12:00:00'), endD = new Date(end+'T12:00:00');
    var rev=0, orders=0, days=0;
    while (d <= endD) {
      var y=d.getFullYear(), mo=d.getMonth()+1, dd=d.getDate();
      var key=y+'-'+(mo<10?'0':'')+mo+'-'+(dd<10?'0':'')+dd;
      var v = dayMap[key];
      if (v && v.orders > 0) { rev += v.rev; orders += v.orders; }
      days++;
      d.setDate(d.getDate()+1);
    }
    return { rev:rev, orders:orders, days:days, avg: days>0 ? rev/days : 0 };
  }

  var today = new Date();
  var allEntries = [];
  PERIODS.forEach(function(p) {
    p.ranges.forEach(function(range) {
      var isFuture = new Date(range[1]+'T12:00:00') > today;
      var year = range[0].substring(0,4);
      var data = isFuture ? null : sumRange(range[0], range[1]);
      allEntries.push({ name:p.name, year:year, start:range[0], end:range[1], data:data, isFuture:isFuture });
    });
  });

  var maxRev = 0;
  allEntries.forEach(function(e){ if(e.data && e.data.rev > maxRev) maxRev = e.data.rev; });

  var grouped = {}, groupOrder = [];
  allEntries.forEach(function(e) {
    if (!grouped[e.name]) { grouped[e.name] = []; groupOrder.push(e.name); }
    grouped[e.name].push(e);
  });

  var html = '<div class="section"><div class="section-title">繁忙期 売上比較 <span class="section-sub">Revenue by busy period</span></div>';
  html += '<div class="period-grid">';
  groupOrder.forEach(function(name) {
    var entries = grouped[name];
    html += '<div class="period-card"><div class="period-name">'+name+'</div><div class="period-years">';
    entries.forEach(function(e) {
      if (e.isFuture) {
        html += '<div class="period-year-row"><span class="period-year">'+e.year+'</span><span class="period-rev" style="color:var(--text-hint);font-size:10px;">Upcoming</span></div>';
      html += '<div class="period-avg" style="color:var(--text-hint);">'+fmtDateRange(e.start, e.end)+'</div>';
        return;
      }
      var pct = maxRev > 0 ? Math.round(e.data.rev/maxRev*100) : 0;
      html += '<div class="period-year-row"><span class="period-year">'+e.year+'</span><span class="period-rev">'+fmtK(e.data.rev)+'</span></div>';
      html += '<div class="period-avg" style="color:var(--text-hint);margin-bottom:2px;">'+fmtDateRange(e.start, e.end)+'</div>';
      html += '<div class="period-bar-wrap"><div class="period-bar"><div class="period-bar-fill" style="width:'+pct+'%"></div></div></div>';
      html += '<div class="period-avg">'+fmt$(e.data.avg)+'/day &middot; '+e.data.orders+' orders</div>';
    });
    html += '</div></div>';
  });
  html += '</div></div>';

  var ranked = allEntries.filter(function(e){ return !e.isFuture && e.data && e.data.orders > 0; });
  ranked.sort(function(a,b){ return b.data.avg - a.data.avg; });
  ranked = ranked.slice(0,15);
  var maxAvg = ranked[0] ? ranked[0].data.avg : 1;
  html += '<div class="section"><div class="section-title">Avg Revenue per Day &mdash; Top 15</div><div class="bar-chart">';
  ranked.forEach(function(e) {
    var pct = Math.round(e.data.avg/maxAvg*100);
    var label = e.name.replace('Holiday','Hol.').replace('Weekend','Wknd') + " '" + e.year.substring(2);
    html += '<div class="bar-row">'
      + '<div class="bar-label" style="width:110px;font-size:10px;">'+label+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%"><span class="bar-val">'+fmtK(e.data.avg)+'</span></div></div>'
      + '</div>';
  });
  html += '</div></div>';

  // ── ① 期待売上予測（今後のUpcoming期間に対して過去2年平均を表示）──
  var upcoming = allEntries.filter(function(e){ return e.isFuture; });
  if (upcoming.length > 0) {
    // 過去データから同名期間の平均を計算
    var forecast = {};
    allEntries.filter(function(e){ return !e.isFuture && e.data && e.data.orders > 0; })
      .forEach(function(e){
        if (!forecast[e.name]) forecast[e.name] = {revs:[], avgs:[]};
        forecast[e.name].revs.push(e.data.rev);
        forecast[e.name].avgs.push(e.data.avg);
      });

    html += '<div class="section"><div class="section-title">📈 Upcoming Period Forecast <span class="section-sub">Based on past years avg</span></div><div class="bar-chart">';
    var maxForecast = 0;
    upcoming.forEach(function(e){
      var f = forecast[e.name];
      if (f && f.revs.length) {
        var avg = f.revs.reduce(function(a,b){return a+b;},0)/f.revs.length;
        if (avg > maxForecast) maxForecast = avg;
      }
    });
    // 重複排除
    var seenFc = {};
    upcoming.forEach(function(e) {
      if (seenFc[e.name]) return;
      seenFc[e.name] = true;
      var f = forecast[e.name];
      var avgRev = f && f.revs.length ? f.revs.reduce(function(a,b){return a+b;},0)/f.revs.length : 0;
      var avgDay = f && f.avgs.length ? f.avgs.reduce(function(a,b){return a+b;},0)/f.avgs.length : 0;
      var pct = maxForecast > 0 && avgRev > 0 ? Math.round(avgRev/maxForecast*100) : 0;
      var label = e.name.length > 18 ? e.name.substring(0,17)+'…' : e.name;
      var noData = avgRev === 0;
      html += '<div class="bar-row">'
        + '<div class="bar-label" style="width:130px;font-size:10px;text-align:right;">'+label+'<br><span style="color:var(--text-hint);font-size:9px;">'+fmtDateRange(e.start,e.end)+'</span></div>'
        + '<div class="bar-track">'
        + (noData
            ? '<div style="font-size:10px;color:var(--text-hint);padding:4px 6px;">No past data</div>'
            : '<div class="bar-fill blue" style="width:'+pct+'%"><span class="bar-val">'+fmtK(avgRev)+'</span></div>')
        + '</div>'
        + (noData ? '' : '<div class="bar-val-out" style="font-size:9px;color:var(--text-hint);">'+fmtK(avgDay)+'/day</div>')
        + '</div>';
    });
    html += '</div></div>';
  }

  el.innerHTML = html;
}

// ── ⑦ SEASONAL — 月別訪問者グラフ & ⑨ 閑散期アラート ──
function renderSeasonal(dailyRows) {
  var el = document.getElementById('tab-seasonal');

  // 月別集計（売上）
  var monthMap = {};
  dailyRows.forEach(function(r) {
    var key = parseGvizDate(r[0]);
    if (!key) return;
    var m = key.substring(0,7);
    if (!monthMap[m]) monthMap[m] = { rev:0, orders:0 };
    monthMap[m].rev += parseFloat(r[1])||0;
    monthMap[m].orders += parseInt(r[2])||0;
  });

  // 月番号(1-12)ごとの平均売上を計算（全年分）
  var monthAvg = {}; // {1: {rev:[], orders:[]}, ...}
  Object.keys(monthMap).forEach(function(mk) {
    var mo = parseInt(mk.substring(5,7));
    if (!monthAvg[mo]) monthAvg[mo] = {revs:[], orders:[]};
    monthAvg[mo].revs.push(monthMap[mk].rev);
    monthAvg[mo].orders.push(monthMap[mk].orders);
  });

  var MON_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // HTA 2024年月別訪問者数データ（実測値）
  var HTA_VISITORS = {
    1:750000, 2:745000, 3:855537, 4:800000, 5:760000, 6:872620,

// ── ⑩ 天気×売上相関 ──
function renderWeatherCorrelation(dailyRows) {
  var el = document.getElementById('tab-weather');
  el.innerHTML = '<div class="loading">Fetching 90 days of Honolulu weather history...</div>';

  // 売上データをdayMapに変換
  var dayMap = {};
  dailyRows.forEach(function(r) {
    var key = parseGvizDate(r[0]);
    if (!key) return;
    dayMap[key] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });

  // Open-Meteo 過去90日の天気を取得（無料・APIキー不要）
  var endDate = new Date();
  endDate.setDate(endDate.getDate() - 1); // 昨日まで
  var startDate = new Date(endDate);
  startDate.setDate(startDate.getDate() - 89); // 90日前

  function fmt(d) {
    return d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate();
  }

  var url = 'https://archive-api.open-meteo.com/v1/archive'
    + '?latitude=21.3069&longitude=-157.8583'
    + '&start_date=' + fmt(startDate)
    + '&end_date='   + fmt(endDate)
    + '&daily=weathercode,precipitation_sum,temperature_2m_max'
    + '&timezone=Pacific%2FHonolulu&temperature_unit=fahrenheit';

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(wdata) {
      if (!wdata.daily) { el.innerHTML = '<div class="error">Weather data unavailable</div>'; return; }
      buildWeatherCorrelation(el, dayMap, wdata.daily);
    })
    .catch(function() {
      el.innerHTML = '<div class="error">Failed to load weather data.</div>';
    });
}

function buildWeatherCorrelation(el, dayMap, wDaily) {
  // 天気×売上を日ごとにペアリング
  var sunny=[], cloudy=[], drizzle=[], rain=[], storm=[];
  var dates = wDaily.time;

  for (var i = 0; i < dates.length; i++) {
    var key = dates[i];
    var sales = dayMap[key];
    if (!sales || sales.orders < 1) continue; // 休業日除外
    var wc = wDaily.weathercode[i];
    var precip = wDaily.precipitation_sum[i] || 0;
    var rev = sales.rev;

    if (wc >= 80 && wc <= 99)      storm.push(rev);   // 嵐・強雨
    else if (wc >= 61 && wc <= 67) rain.push(rev);    // 雨
    else if (wc >= 51 && wc <= 59) drizzle.push(rev); // 小雨
    else if (wc >= 1  && wc <= 3)  cloudy.push(rev);  // 曇り
    else                           sunny.push(rev);   // 晴れ
  }

  function avg(arr) {
    if (!arr.length) return null;
    return arr.reduce(function(a,b){return a+b;},0) / arr.length;
  }
  function pctDiff(base, val) {
    if (!base || !val) return null;
    return ((val - base) / base * 100);
  }

  var baseRev = avg(sunny) || avg(cloudy) || 1;
  var categories = [
    { label:'☀️ Sunny',    arr:sunny,   color:'orange' },
    { label:'☁️ Cloudy',   arr:cloudy,  color:'blue'   },
    { label:'🌦️ Drizzle',  arr:drizzle, color:'blue'   },
    { label:'🌧️ Rain',     arr:rain,    color:'green'  },
    { label:'⛈️ Storm',    arr:storm,   color:'purple' }
  ];

  var maxAvg = 0;
  categories.forEach(function(c){ var a=avg(c.arr); if(a&&a>maxAvg)maxAvg=a; });

  // ── Summary cards ──
  var rainAvg   = avg(rain);
  var stormAvg  = avg(storm);
  var sunnyAvg  = avg(sunny);
  var rainDiff  = pctDiff(baseRev, rainAvg);
  var stormDiff = pctDiff(baseRev, stormAvg);

  var html = '<div class="section"><div class="section-title">☁️ Weather vs Revenue <span class="section-sub">Last 90 days · Honolulu actual</span></div>';

  // サマリーカード
  html += '<div class="summary-row">';
  if (rainAvg) {
    var rd = rainDiff ? (rainDiff>=0?'▲':'▼')+Math.abs(rainDiff).toFixed(0)+'%' : '—';
    var rdColor = rainDiff&&rainDiff>=0?'#16a34a':'#dc2626';
    html += '<div class="summary-card"><div class="summary-label">🌧️ Rainy days avg</div>'
      +'<div class="summary-val orange">'+fmt$(rainAvg)+'</div>'
      +'<div style="font-size:11px;font-weight:600;color:'+rdColor+';">'+rd+' vs sunny</div></div>';
  }
  if (stormAvg) {
    var sd2 = stormDiff ? (stormDiff>=0?'▲':'▼')+Math.abs(stormDiff).toFixed(0)+'%' : '—';
    var sdColor = stormDiff&&stormDiff>=0?'#16a34a':'#dc2626';
    html += '<div class="summary-card"><div class="summary-label">⛈️ Stormy days avg</div>'
      +'<div class="summary-val orange">'+fmt$(stormAvg)+'</div>'
      +'<div style="font-size:11px;font-weight:600;color:'+sdColor+';">'+sd2+' vs sunny</div></div>';
  }
  if (sunnyAvg) {
    html += '<div class="summary-card"><div class="summary-label">☀️ Sunny days avg</div>'
      +'<div class="summary-val">'+fmt$(sunnyAvg)+'</div>'
      +'<div style="font-size:11px;color:var(--text-hint);">(baseline)</div></div>';
  }
  html += '</div>';

  // バーチャート
  html += '<div class="bar-chart" style="margin-top:8px;">';
  categories.forEach(function(c) {
    var a = avg(c.arr);
    if (!a) return;
    var pct = maxAvg > 0 ? Math.round(a / maxAvg * 100) : 0;
    var diff = pctDiff(baseRev, a);
    var diffStr = diff !== null ? ' <span style="font-size:9px;color:'+(diff>=0?'#16a34a':'#dc2626')+';">'+(diff>=0?'▲':'▼')+Math.abs(diff).toFixed(0)+'%</span>' : '';
    var countStr = ' <span style="font-size:9px;color:var(--text-hint);">('+c.arr.length+'days)</span>';
    html += '<div class="bar-row">'
      + '<div class="bar-label" style="width:100px;">'+c.label+'</div>'
      + '<div class="bar-track"><div class="bar-fill '+c.color+'" style="width:'+pct+'%">'
      + (pct>20?'<span class="bar-val">'+fmt$(a)+'</span>':'')
      + '</div>'
      + (pct<=20?'<span class="bar-val-out">'+fmt$(a)+'</span>':'')
      + diffStr + countStr
      + '</div></div>';
  });
  html += '</div>';

  // 注釈
  html += '<div style="font-size:10px;color:var(--text-hint);margin-top:8px;line-height:1.6;">'
    + '📊 Based on actual weather data from Open-Meteo archive.<br>'
    + '🍽️ Bad weather = more indoor dining at Ala Moana = higher revenue.<br>'
    + '📅 Days with 0 orders (closed) are excluded.'
    + '</div></div>';

  // ── 月別降水量×売上の散布図風テーブル ──
  var monthData = {};
  dates.forEach(function(key, i) {
    var m = key.substring(0, 7);
    var sales = dayMap[key];
    if (!sales || sales.orders < 1) return;
    if (!monthData[m]) monthData[m] = { rev:0, rain:0, days:0 };
    monthData[m].rev   += sales.rev;
    monthData[m].rain  += (wDaily.precipitation_sum[i] || 0);
    monthData[m].days  += 1;
  });

  var months = Object.keys(monthData).sort().slice(-3); // 直近3ヶ月
  if (months.length) {
    html += '<div class="section"><div class="section-title">Recent 3 Months — Rain vs Revenue</div>'
      + '<table class="data-table"><tr><th>Month</th><th class="num">Revenue</th><th class="num">Avg/day</th><th class="num">Rain (mm)</th></tr>';
    months.forEach(function(m) {
      var d = monthData[m];
      var avgDay = d.days > 0 ? d.rev / d.days : 0;
      html += '<tr><td>'+m+'</td><td class="num rev">'+fmt$(d.rev)+'</td><td class="num">'+fmt$(avgDay)+'</td>'
        + '<td class="num">'+d.rain.toFixed(0)+'mm</td></tr>';
    });
    html += '</table></div>';
  }

  el.innerHTML = html;
}

// ── DAILY SALES ──
function renderDaily(rows) {
  var el = document.getElementById('tab-daily');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  // Last 30 days
  var last30 = rows.slice(-30);
  var totalRev = 0, totalOrders = 0;
  rows.forEach(function(r){ totalRev += parseFloat(r[1])||0; totalOrders += parseInt(r[2])||0; });

  var html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-label">Total Revenue</div><div class="summary-val orange">'+fmt$(totalRev)+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">Total Orders</div><div class="summary-val">'+totalOrders.toLocaleString()+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">Avg Ticket</div><div class="summary-val">'+fmt$(totalRev/totalOrders)+'</div></div>'
    + '</div>';

  // Bar chart last 30 days
  html += '<div class="section"><div class="section-title">Last 30 Days</div><div class="bar-chart">';
  var maxRev = 0;
  last30.forEach(function(r){ var v=parseFloat(r[1])||0; if(v>maxRev) maxRev=v; });
  last30.forEach(function(r) {
    var date = r[0] ? parseGvizDate(r[0]).substring(5) : '';
    var rev = parseFloat(r[1])||0;
    var pct = maxRev > 0 ? Math.round(rev/maxRev*100) : 0;
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+date+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%">'
      + (pct > 15 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 15 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  // Table
  // Build dayMap for YoY lookups
  var dayMap2 = {};
  rows.forEach(function(r) {
    var k = parseGvizDate(r[0]);
    if (k) dayMap2[k] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });
  function lyDate(k) {
    var d = new Date(k+'T12:00:00'); d.setFullYear(d.getFullYear()-1);
    var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
    return y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
  }
  function lyWeekAvg(k) {
    var total=0,count=0;
    for(var i=-3;i<=3;i++){
      var d=new Date(k+'T12:00:00'); d.setFullYear(d.getFullYear()-1); d.setDate(d.getDate()+i);
      var y=d.getFullYear(),mo=d.getMonth()+1,dd=d.getDate();
      var wk=y+'-'+(mo<10?'0':'')+mo+'-'+(dd<10?'0':'')+dd;
      if(dayMap2[wk]){total+=dayMap2[wk].rev;count++;}
    }
    return count>0?total/count:null;
  }
  function lyMonthTotal(k) {
    var mo=k.substring(0,4-1-1,7); // wrong, use substring
    var mo=k.substring(0,7);
    var lyMo=(parseInt(mo.substring(0,4))-1)+'-'+mo.substring(5);
    var total=0,found=false;
    Object.keys(dayMap2).forEach(function(d){ if(d.startsWith(lyMo)){total+=dayMap2[d].rev;found=true;} });
    return found?total:null;
  }

  html += '<div class="section"><div class="section-title">All Data</div>'
    + '<table class="data-table"><tr><th>Date</th><th class="num">Revenue</th><th class="num">Orders</th><th class="num">Avg Ticket</th><th class="num">vs LY Day</th><th class="num">vs LY Week</th></tr>';
  rows.slice().reverse().forEach(function(r) {
    var k = parseGvizDate(r[0]);
    var rev = parseFloat(r[1])||0;
    var ly = k ? dayMap2[lyDate(k)] : null;
    var lyW = k ? lyWeekAvg(k) : null;
    var yoyD = ly&&ly.rev>0 ? ((rev-ly.rev)/ly.rev*100) : null;
    var yoyW = lyW&&lyW>0 ? ((rev-lyW)/lyW*100) : null;
    function yoyCell(v){ return v===null?'<td class="num" style="color:var(--text-hint);">—</td>'
      :'<td class="num" style="color:'+(v>=0?'#16a34a':'#dc2626')+';">'+(v>=0?'▲':'▼')+Math.abs(v).toFixed(0)+'%</td>'; }
    html += '<tr><td>'+k+'</td><td class="num rev">'+fmt$(rev)+'</td><td class="num">'+r[2]+'</td><td class="num">'+fmt$(r[3])+'</td>'
      +yoyCell(yoyD)+yoyCell(yoyW)+'</tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}


// ── MONTHLY SALES ──
function renderMonthly(dailyRows) {
  var el = document.getElementById('tab-monthly');

  // Build dayMap
  var dayMap = {};
  dailyRows.forEach(function(r) {
    var key = parseGvizDate(r[0]);
    if (!key) return;
    dayMap[key] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });

  // Aggregate by month
  var monthMap = {};
  Object.keys(dayMap).forEach(function(k) {
    var m = k.substring(0,7);
    if (!monthMap[m]) monthMap[m] = { rev:0, orders:0 };
    monthMap[m].rev += dayMap[k].rev;
    monthMap[m].orders += dayMap[k].orders;
  });

  var months = Object.keys(monthMap).sort();
  if (!months.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  // YoY comparison helpers
  function lyKey(m) {
    var parts = m.split('-');
    return (parseInt(parts[0])-1)+'-'+parts[1];
  }

  // Summary cards - current year
  var curYear = new Date().getFullYear().toString();
  var prevYear = (new Date().getFullYear()-1).toString();
  var cyMonths = months.filter(function(m){ return m.startsWith(curYear); });
  var pyMonths = months.filter(function(m){ return m.startsWith(prevYear); });
  var cyRev = cyMonths.reduce(function(s,m){ return s+monthMap[m].rev; },0);
  var pyRev = pyMonths.reduce(function(s,m){ return s+monthMap[m].rev; },0);
  var yoyPct = pyRev>0 ? ((cyRev-pyRev)/pyRev*100) : null;

  var html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-label">'+curYear+' Revenue</div><div class="summary-val orange">'+fmt$(cyRev)+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">vs '+prevYear+'</div><div class="summary-val '+(yoyPct===null?'':yoyPct>=0?'':'')+(yoyPct!==null?(yoyPct>=0?'orange':''):'')+'">'+
      (yoyPct===null?'—':(yoyPct>=0?'▲':'▼')+Math.abs(yoyPct).toFixed(1)+'%')+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">'+curYear+' Orders</div><div class="summary-val">'
    + cyMonths.reduce(function(s,m){ return s+monthMap[m].orders; },0).toLocaleString()+'</div></div>'
    + '</div>';

  // Bar chart - last 24 months
  var last24 = months.slice(-24);
  var maxRev = last24.reduce(function(mx,m){ return Math.max(mx,monthMap[m].rev); },0);

  html += '<div class="section"><div class="section-title">Monthly Revenue — Last 24 Months</div><div class="bar-chart">';
  last24.forEach(function(m) {
    var v = monthMap[m];
    var ly = monthMap[lyKey(m)];
    var pct = maxRev>0 ? Math.round(v.rev/maxRev*100) : 0;
    var yoy = ly ? ((v.rev-ly.rev)/ly.rev*100) : null;
    var yoyStr = yoy!==null ? ' <span style="font-size:9px;color:'+(yoy>=0?'#16a34a':'#dc2626')+';">'+(yoy>=0?'▲':'▼')+Math.abs(yoy).toFixed(0)+'%</span>' : '';
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+m.substring(2)+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%">'
      + (pct>15?'<span class="bar-val">'+fmtK(v.rev)+'</span>':'')
      + '</div>'
      + (pct<=15?'<span class="bar-val-out">'+fmtK(v.rev)+'</span>':'')
      + yoyStr
      + '</div></div>';
  });
  html += '</div></div>';

  // Table - all months
  html += '<div class="section"><div class="section-title">All Months</div>'
    + '<table class="data-table"><tr><th>Month</th><th class="num">Revenue</th><th class="num">Orders</th><th class="num">Avg</th><th class="num">vs LY</th></tr>';
  months.slice().reverse().forEach(function(m) {
    var v = monthMap[m];
    var ly = monthMap[lyKey(m)];
    var yoy = ly ? ((v.rev-ly.rev)/ly.rev*100) : null;
    var avg = v.orders>0 ? v.rev/v.orders : 0;
    html += '<tr><td>'+m+'</td><td class="num rev">'+fmt$(v.rev)+'</td><td class="num">'+v.orders+'</td><td class="num">'+fmt$(avg)+'</td>'
      + '<td class="num" style="color:'+(yoy===null?'var(--text-hint)':yoy>=0?'#16a34a':'#dc2626')+';">'
      + (yoy===null?'—':(yoy>=0?'▲':'▼')+Math.abs(yoy).toFixed(1)+'%')+'</td></tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}

    var key = parseGvizDate(r[0]);
    if (!key) return;
    dayMap[key] = { rev: parseFloat(r[1])||0, orders: parseInt(r[2])||0 };
  });

  var yearMap = {};
  Object.keys(dayMap).forEach(function(k) {
    var y = k.substring(0,4);
    if (!yearMap[y]) yearMap[y] = { rev:0, orders:0 };
    yearMap[y].rev += dayMap[k].rev;
    yearMap[y].orders += dayMap[k].orders;
  });

  var years = Object.keys(yearMap).sort();
  if (!years.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  var maxRev = years.reduce(function(mx,y){ return Math.max(mx,yearMap[y].rev); },0);

  // Summary
  var curY = new Date().getFullYear().toString();
  var prevY = (new Date().getFullYear()-1).toString();
  var cy = yearMap[curY]||{rev:0,orders:0};
  var py = yearMap[prevY]||{rev:0,orders:0};
  var yoy = py.rev>0 ? ((cy.rev-py.rev)/py.rev*100) : null;

  var html = '<div class="summary-row">'
    + '<div class="summary-card"><div class="summary-label">'+curY+' Revenue</div><div class="summary-val orange">'+fmt$(cy.rev)+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">vs '+prevY+'</div><div class="summary-val">'+
      (yoy===null?'—':(yoy>=0?'▲':'▼')+Math.abs(yoy).toFixed(1)+'%')+'</div></div>'
    + '<div class="summary-card"><div class="summary-label">Best Year</div><div class="summary-val">'
    + years.reduce(function(best,y){ return yearMap[y].rev>yearMap[best].rev?y:best; },years[0])
    + '</div></div>'
    + '</div>';

  // Bar chart
  html += '<div class="section"><div class="section-title">Annual Revenue</div><div class="bar-chart">';
  years.forEach(function(y) {
    var v = yearMap[y];
    var py2 = yearMap[(parseInt(y)-1).toString()];
    var pct = maxRev>0 ? Math.round(v.rev/maxRev*100) : 0;
    var yoy2 = py2 ? ((v.rev-py2.rev)/py2.rev*100) : null;
    var yoyStr = yoy2!==null ? ' <span style="font-size:9px;color:'+(yoy2>=0?'#16a34a':'#dc2626')+';">'+(yoy2>=0?'▲':'▼')+Math.abs(yoy2).toFixed(1)+'%</span>' : '';
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+y+'</div>'
      + '<div class="bar-track"><div class="bar-fill orange" style="width:'+pct+'%">'
      + '<span class="bar-val">'+fmtK(v.rev)+'</span>'
      + '</div>'+yoyStr+'</div></div>';
  });
  html += '</div></div>';

  // Table
  html += '<div class="section"><div class="section-title">Year by Year</div>'
    + '<table class="data-table"><tr><th>Year</th><th class="num">Revenue</th><th class="num">Orders</th><th class="num">Avg Ticket</th><th class="num">vs Prior Year</th></tr>';
  years.slice().reverse().forEach(function(y) {
    var v = yearMap[y];
    var py2 = yearMap[(parseInt(y)-1).toString()];
    var yoy2 = py2 ? ((v.rev-py2.rev)/py2.rev*100) : null;
    var avg = v.orders>0 ? v.rev/v.orders : 0;
    html += '<tr><td>'+y+'</td><td class="num rev">'+fmt$(v.rev)+'</td><td class="num">'+v.orders.toLocaleString()+'</td><td class="num">'+fmt$(avg)+'</td>'
      + '<td class="num" style="color:'+(yoy2===null?'var(--text-hint)':yoy2>=0?'#16a34a':'#dc2626')+';">'
      + (yoy2===null?'—':(yoy2>=0?'▲':'▼')+Math.abs(yoy2).toFixed(1)+'%')+'</td></tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}

// ── HOURLY SALES ──
function renderHourly(rows) {
  var el = document.getElementById('tab-hourly');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  var maxRev = 0;
  rows.forEach(function(r){ var v=parseFloat(r[1])||0; if(v>maxRev) maxRev=v; });

  // Find peak hours
  var sorted = rows.slice().sort(function(a,b){ return (parseFloat(b[1])||0)-(parseFloat(a[1])||0); });
  var peak = sorted.slice(0,3).filter(function(r){ return parseFloat(r[1])>0; });

  var html = '<div class="section"><div class="section-title">Peak Hours</div><div class="summary-row">';
  peak.forEach(function(r,i) {
    html += '<div class="summary-card"><div class="summary-label">#'+(i+1)+' '+r[0]+'</div><div class="summary-val orange">'+fmt$(r[1])+'</div></div>';
  });
  html += '</div></div>';

  html += '<div class="section"><div class="section-title">Avg Revenue by Hour</div><div class="bar-chart">';
  rows.forEach(function(r) {
    var rev = parseFloat(r[1])||0;
    if (rev === 0) return;
    var pct = maxRev > 0 ? Math.round(rev/maxRev*100) : 0;
    html += '<div class="bar-row">'
      + '<div class="bar-label">'+r[0]+'</div>'
      + '<div class="bar-track"><div class="bar-fill blue" style="width:'+pct+'%">'
      + (pct > 15 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 15 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  el.innerHTML = html;
}

// ── ITEM SALES ──
function renderItems(rows) {
  var el = document.getElementById('tab-items');
  if (!rows.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }

  var top = rows.slice(0, 20);
  var maxRev = parseFloat(top[0][2])||1;
  var totalRev = 0;
  rows.forEach(function(r){ totalRev += parseFloat(r[2])||0; });

  var html = '<div class="section"><div class="section-title">Top Items by Revenue</div><div class="bar-chart">';
  top.forEach(function(r, i) {
    var rev = parseFloat(r[2])||0;
    if (rev === 0) return;
    var pct = Math.round(rev/maxRev*100);
    var colors = ['orange','orange','orange','blue','blue','blue','green','green','green','purple'];
    var color = colors[Math.min(i, colors.length-1)];
    html += '<div class="bar-row">'
      + '<div class="bar-label" style="font-size:10px;line-height:1.2;">'+r[0]+'</div>'
      + '<div class="bar-track"><div class="bar-fill '+color+'" style="width:'+pct+'%">'
      + (pct > 20 ? '<span class="bar-val">'+fmtK(rev)+'</span>' : '')
      + '</div>'
      + (pct <= 20 ? '<span class="bar-val-out">'+fmtK(rev)+'</span>' : '')
      + '</div></div>';
  });
  html += '</div></div>';

  html += '<div class="section"><div class="section-title">All Items</div>'
    + '<table class="data-table"><tr><th>Item</th><th class="num">Qty</th><th class="num">Revenue</th></tr>';
  rows.forEach(function(r) {
    html += '<tr><td>'+r[0]+'</td><td class="num">'+parseInt(r[1]).toLocaleString()+'</td><td class="num rev">'+fmt$(r[2])+'</td></tr>';
  });
  html += '</table></div>';

  el.innerHTML = html;
}

// Init
document.getElementById('updatedLabel').textContent = 'Data updated daily at 3:00 AM';
renderTab('busy');

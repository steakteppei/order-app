<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Steak Teppei — Version History</title>
<style>
:root{--bg:#f5f4f2;--card:#fff;--border:rgba(0,0,0,.08);--text:#1a1a1a;--text-sub:#555;--text-hint:#999;--radius:16px;--radius-sm:10px;--orange:#E8440A;--orange-light:#fff2ed;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#252525;--border:rgba(255,255,255,.1);--text:#f0f0f0;--text-sub:#aaa;--text-hint:#666;--orange-light:#2a1206;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:-apple-system,'SF Pro Text',sans-serif;color:var(--text);}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}
.cl-header{background:var(--orange);color:#fff;padding:16px 16px 18px;position:sticky;top:0;z-index:100;}
.cl-header-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.cl-back{background:rgba(255,255,255,.22);border:none;border-radius:20px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:5px 13px;-webkit-tap-highlight-color:transparent;}
.cl-back:active{opacity:.7;}
.cl-title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.cl-sub{font-size:11px;opacity:.75;}
.content{max-width:480px;margin:0 auto;padding:14px 13px 48px;}
.ver-card{background:var(--card);border:.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.ver-card.latest{border:1.5px solid var(--orange);}
.ver-hero{background:var(--orange);color:#fff;padding:16px 16px 14px;display:flex;align-items:center;justify-content:space-between;}
.ver-hero-icon{font-size:30px;}
.ver-hero-right{text-align:right;}
.ver-hero-label{font-size:10px;opacity:.8;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.ver-hero-num{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.ver-hero-date{font-size:11px;opacity:.75;margin-top:1px;}
.ver-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;}
.ver-num{font-size:15px;font-weight:800;color:var(--text);}
.ver-date-label{font-size:11px;color:var(--text-hint);}
.ver-items{border-top:.5px solid var(--border);padding:2px 0 4px;}
.ver-item{display:flex;align-items:flex-start;gap:10px;padding:8px 14px;}
.ver-item-icon{width:28px;height:28px;background:var(--orange-light);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;margin-top:2px;}
.ver-item-text{font-size:13px;color:var(--text-sub);line-height:1.5;flex:1;padding-top:4px;}
.cl-footer{text-align:center;font-size:11px;color:var(--text-hint);padding:8px 0 4px;}
</style>
</head>
<body>
<div class="cl-header">
  <div class="cl-header-top">
    <button class="cl-back" onclick="history.length>1?history.back():location.href='index.html'">&#8249; Back</button>
  </div>
  <div class="cl-title">Version History</div>
  <div class="cl-sub">Steak Teppei Order App · Makai Market Food Court</div>
</div>
<div class="content">
  <div id="versionList"></div>
  <div class="cl-footer">Built with ❤️ for Steak Teppei · Ala Moana Center</div>
</div>
<script>
var VERSIONS = [
  {
    version: '4.1',
    date: 'April 10, 2026',
    items: [
      { icon: '🐛', text: 'Fixed: deadlineInfo DOM error in restoreState removed' },
      { icon: '🎌', text: 'Fixed: all supplier deadlines skip on Hawaii holidays — previous business day rule applied' },
      { icon: '🌡️', text: 'Weather now shows °F + °C side by side' },
      { icon: '↩️', text: 'Back from send screen now restores your order without resetting' },
      { icon: '👆', text: 'Calendar shows guidance when no supplier is selected' },
      { icon: '📅', text: 'Next available delivery date shown after selecting a supplier' },
      { icon: '⚠️', text: 'Costco prices marked as estimates — actual invoice may differ' },
      { icon: '🌧️', text: 'Rain / storm days show 👥↑ — more customers expected at Ala Moana' },
      { icon: '🔁', text: 'Recent orders saved — tap to reuse a previous order in one tap' },
      { icon: '📋', text: 'Version History page redesigned to match app style' }
    ]
  },
  {
    version: '4.0',
    date: 'April 10, 2026',
    items: [
      { icon: '🎏', text: 'Fixed: Golden Week no longer shown as slow season' },
      { icon: '🗓️', text: 'Fixed: Sep slow season overlap with September Holidays corrected' },
      { icon: '✅', text: 'All busy/slow periods verified — zero overlaps' },
      { icon: '🌤️', text: 'Honolulu 7-day weather forecast added' }
    ]
  },
  {
    version: '3.8',
    date: 'April 10, 2026',
    items: [
      { icon: '🌤️', text: 'Weather forecast added — 7 days, rainy days highlighted' },
      { icon: '🗓️', text: 'Calendar date badges refined — transparent for plain dates' }
    ]
  },
  {
    version: '3.3',
    date: 'April 10, 2026',
    items: [
      { icon: '🐛', text: 'Fixed: Costco subtotal now updates correctly' },
      { icon: '🗓️', text: 'Calendar legend added — color guide for slow season & marathon week' }
    ]
  },
  {
    version: '3.2',
    date: 'April 10, 2026',
    items: [
      { icon: '🔢', text: 'Tap quantity number to type directly' },
      { icon: '📈', text: 'Costco progress bar toward $1,000 minimum' },
      { icon: '🏃', text: 'Honolulu Marathon highlighted in yellow on calendar' },
      { icon: '📉', text: 'Slow seasons shown in gray on calendar' },
      { icon: '🍁', text: 'Canada Snowbird season added' },
      { icon: '📊', text: 'Seasonal tab in Sales Data — visitor index & market mix' },
      { icon: '🔮', text: 'Upcoming period forecast based on past years avg' }
    ]
  },
  {
    version: '3.1',
    date: 'April 10, 2026',
    items: [
      { icon: '📊', text: 'Busy periods expanded — Winter Peak, US Summer, Spring Break added' },
      { icon: '🎄', text: 'Christmas Week added' },
      { icon: '🗓️', text: 'Silver Week all years included (2026 = 5-day)' }
    ]
  },
  {
    version: '3.0',
    date: 'April 10, 2026',
    items: [
      { icon: '🔄', text: 'Auto-update when new version is available' },
      { icon: '💤', text: 'Auto-reload after 5 minutes idle' },
      { icon: '🔔', text: 'Changelog popup redesigned — slides up from bottom' }
    ]
  },
  {
    version: '2.7',
    date: 'April 8, 2026',
    items: [
      { icon: '📅', text: 'Last year same-week sales added to calendar' }
    ]
  },
  {
    version: '2.6',
    date: 'March 2026',
    items: [
      { icon: '🗓️', text: 'Upcoming busy periods list added to calendar' },
      { icon: '🇯🇵', text: 'Japan Golden Week, Obon, Silver Week added' },
      { icon: '🏫', text: 'Hawaii DOE school breaks added' }
    ]
  },
  {
    version: '2.4',
    date: 'January 2026',
    items: [
      { icon: '📊', text: 'Sales Data page launched' },
      { icon: '📈', text: 'Busy Periods, Daily, Monthly, Yearly, Hourly, Items tabs' }
    ]
  },
  {
    version: '2.2',
    date: 'November 2025',
    items: [
      { icon: '💰', text: 'Costco item prices and subtotal added' },
      { icon: '✅', text: 'Minimum order tracker ($1,000)' },
      { icon: '✏️', text: 'Custom item add feature' }
    ]
  },
  {
    version: '2.0',
    date: 'September 2025',
    items: [
      { icon: '🎨', text: 'Full UI redesign — card layout, dark mode support' },
      { icon: '📅', text: 'Interactive calendar with delivery day highlighting' },
      { icon: '🏝️', text: 'Hawaii state holidays integrated' }
    ]
  },
  {
    version: '1.0',
    date: 'July 2019',
    items: [
      { icon: '🚀', text: 'Initial launch — basic order form for suppliers' }
    ]
  }
];

function render(){
  var el=document.getElementById('versionList');
  var html='';
  VERSIONS.forEach(function(v,idx){
    var isLatest=idx===0;
    if(isLatest){
      html+='<div class="ver-card latest"><div class="ver-hero"><div class="ver-hero-icon">🚀</div><div class="ver-hero-right"><div class="ver-hero-label">Current Version</div><div class="ver-hero-num">v'+v.version+'</div><div class="ver-hero-date">'+v.date+'</div></div></div>';
    } else {
      html+='<div class="ver-card"><div class="ver-head"><div class="ver-num">v'+v.version+'</div><div class="ver-date-label">'+v.date+'</div></div>';
    }
    html+='<div class="ver-items">';
    v.items.forEach(function(item){
      html+='<div class="ver-item"><div class="ver-item-icon">'+item.icon+'</div><div class="ver-item-text">'+item.text+'</div></div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
}
render();
</script>
</body>
</html>

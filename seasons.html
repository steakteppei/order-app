<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Steak Teppei — Busy & Slow Seasons</title>
<style>
:root{--bg:#f5f4f2;--card:#fff;--border:rgba(0,0,0,.08);--border-md:rgba(0,0,0,.14);--text:#1a1a1a;--text-sub:#555;--text-hint:#999;--radius:16px;--radius-sm:10px;--orange:#E8440A;--orange-light:#fff2ed;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#252525;--border:rgba(255,255,255,.1);--border-md:rgba(255,255,255,.18);--text:#f0f0f0;--text-sub:#aaa;--text-hint:#666;--orange-light:#2a1206;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);font-family:-apple-system,'SF Pro Text',sans-serif;color:var(--text);}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}

.sn-header{background:var(--orange);color:#fff;padding:16px 16px 18px;position:sticky;top:0;z-index:100;}
.sn-header-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.sn-back{background:rgba(255,255,255,.22);border:none;border-radius:20px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:5px 13px;}
.sn-back:active{opacity:.7;}
.sn-title{font-size:18px;font-weight:800;letter-spacing:-.3px;}
.sn-sub{font-size:11px;opacity:.75;}

/* Year tabs */
.year-tabs{display:flex;gap:8px;padding:12px 13px 0;background:var(--bg);position:sticky;top:68px;z-index:90;}
.year-btn{flex:1;padding:9px 4px;border-radius:var(--radius-sm);border:.5px solid var(--border-md);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;color:var(--text-hint);text-align:center;}
.year-btn.active{background:var(--orange-light);color:var(--orange);border-color:var(--orange);}

/* Region filter */
.filter-wrap{display:flex;gap:6px;padding:10px 13px 0;flex-wrap:wrap;background:var(--bg);}
.filter-btn{padding:5px 11px;border-radius:20px;border:.5px solid var(--border-md);background:var(--card);font-size:11px;font-weight:600;cursor:pointer;color:var(--text-hint);}
.filter-btn.active-us{background:#e8f0fe;color:#1a56db;border-color:#1a56db;}
.filter-btn.active-jp{background:#fce7f3;color:#be185d;border-color:#be185d;}
.filter-btn.active-hi{background:#fff2ed;color:var(--orange);border-color:var(--orange);}
.filter-btn.active-ca{background:#fef3c7;color:#92400e;border-color:#d97706;}
.filter-btn.active-slow{background:#f1f5f9;color:#475569;border-color:#94a3b8;}
.filter-btn.active-all{background:var(--orange-light);color:var(--orange);border-color:var(--orange);}

.content{padding:10px 13px 48px;}

/* Section header */
.month-head{font-size:11px;font-weight:700;color:var(--text-hint);text-transform:uppercase;letter-spacing:.08em;padding:14px 0 6px;border-bottom:.5px solid var(--border);margin-bottom:6px;}
.month-head:first-child{padding-top:4px;}

/* Period card */
.period-card{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:6px;}
.period-card.busy-us{border-left:3px solid #1a56db;}
.period-card.busy-jp{border-left:3px solid #be185d;}
.period-card.busy-hi{border-left:3px solid var(--orange);}
.period-card.busy-ca{border-left:3px solid #d97706;}
.period-card.slow{border-left:3px solid #94a3b8;opacity:.85;}
.period-card.now{box-shadow:0 0 0 1.5px var(--orange);}

.period-left{flex:1;min-width:0;}
.period-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.period-date{font-size:11px;color:var(--text-hint);margin-top:3px;}
.period-tip{font-size:11px;color:var(--text-sub);margin-top:4px;line-height:1.5;}

.period-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.region-badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px;white-space:nowrap;}
.badge-us{background:#e8f0fe;color:#1a56db;}
.badge-jp{background:#fce7f3;color:#be185d;}
.badge-hi{background:#fff2ed;color:var(--orange);}
.badge-ca{background:#fef3c7;color:#92400e;}
.badge-slow{background:#f1f5f9;color:#475569;}
.now-badge{font-size:9px;font-weight:700;background:#dc2626;color:#fff;padding:3px 7px;border-radius:10px;}

.no-results{text-align:center;padding:32px 0;font-size:13px;color:var(--text-hint);}
.footer-note{text-align:center;font-size:11px;color:var(--text-hint);padding:8px 0;opacity:.7;}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px 0;background:var(--bg);}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-hint);}
.legend-bar{width:4px;height:14px;border-radius:2px;}
</style>
</head>
<body>

<div class="sn-header">
  <div class="sn-header-top">
    <button class="sn-back" onclick="history.length>1?history.back():location.href='index.html'">&#8249; Back</button>
  </div>
  <div class="sn-title">Busy &amp; Slow Seasons</div>
  <div class="sn-sub">Honolulu · Ala Moana Center</div>
</div>

<div class="year-tabs">
  <button class="year-btn active" id="yr-2026" onclick="setYear('2026')">2026</button>
  <button class="year-btn" id="yr-2027" onclick="setYear('2027')">2027</button>
  <button class="year-btn" id="yr-all"  onclick="setYear('all')">All</button>
</div>

<div class="filter-wrap">
  <button class="filter-btn active-all" id="f-all"  onclick="setFilter('all')">All</button>
  <button class="filter-btn" id="f-us"   onclick="setFilter('us')">&#127482;&#127480; US</button>
  <button class="filter-btn" id="f-jp"   onclick="setFilter('jp')">&#127471;&#127477; Japan</button>
  <button class="filter-btn" id="f-hi"   onclick="setFilter('hi')">&#127959; Hawaii</button>
  <button class="filter-btn" id="f-ca"   onclick="setFilter('ca')">&#127464;&#127462; Canada</button>
  <button class="filter-btn" id="f-slow" onclick="setFilter('slow')">&#128197; Slow</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-bar" style="background:#1a56db;"></div>US</div>
  <div class="legend-item"><div class="legend-bar" style="background:#be185d;"></div>Japan</div>
  <div class="legend-item"><div class="legend-bar" style="background:#E8440A;"></div>Hawaii</div>
  <div class="legend-item"><div class="legend-bar" style="background:#d97706;"></div>Canada</div>
  <div class="legend-item"><div class="legend-bar" style="background:#94a3b8;"></div>Slow season</div>
</div>

<div class="content" id="seasonList"></div>

<script>
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// 全期間データ（region: us/jp/hi/ca/slow）
var PERIODS = [
  // ── BUSY: US ──
  { region:'us', name:'Winter Peak Season',          start:'2025-12-15', end:'2026-01-04', tip:'Peak Hawaii tourism — US mainland families on winter vacation.' },
  { region:'us', name:'Valentine\'s & Presidents Day',start:'2026-02-12', end:'2026-02-16', tip:'Long weekend drives short-haul Hawaii trips from US West Coast.' },
  { region:'us', name:'US Spring Break',             start:'2026-03-14', end:'2026-04-12', tip:'College & K-12 spring breaks. Major influx from California & Pacific Northwest.' },
  { region:'us', name:'Memorial Day Weekend',        start:'2026-05-23', end:'2026-05-25', tip:'US federal holiday. Long weekend — many fly to Hawaii.' },
  { region:'us', name:'US Summer Break',             start:'2026-06-06', end:'2026-08-20', tip:'Busiest season for US mainland visitors. Families travel during school summer break.' },
  { region:'us', name:'Independence Day',            start:'2026-07-03', end:'2026-07-06', tip:'4th of July long weekend. High domestic travel volume.' },
  { region:'us', name:'Labor Day Weekend',           start:'2026-09-05', end:'2026-09-07', tip:'Last summer holiday. Short peak before fall slowdown.' },
  { region:'us', name:'Thanksgiving Week',           start:'2026-11-25', end:'2026-11-29', tip:'US Thanksgiving. Families travel; Ala Moana busy with holiday shoppers.' },
  { region:'us', name:'Christmas Week',              start:'2026-12-22', end:'2026-12-26', tip:'High domestic travel. Many families spend Christmas in Hawaii.' },
  { region:'us', name:'Winter Peak Season',          start:'2026-12-15', end:'2027-01-03', tip:'Peak Hawaii tourism — US mainland families on winter vacation.' },
  { region:'us', name:'Valentine\'s & Presidents Day',start:'2027-02-11', end:'2027-02-15', tip:'Long weekend drives short-haul Hawaii trips from US West Coast.' },
  { region:'us', name:'US Spring Break',             start:'2027-03-13', end:'2027-04-11', tip:'College & K-12 spring breaks. Major influx from California & Pacific Northwest.' },
  { region:'us', name:'Memorial Day Weekend',        start:'2027-05-29', end:'2027-05-31', tip:'US federal holiday. Long weekend.' },
  { region:'us', name:'US Summer Break',             start:'2027-06-05', end:'2027-08-20', tip:'Busiest season for US mainland visitors.' },
  { region:'us', name:'Independence Day',            start:'2027-07-04', end:'2027-07-06', tip:'4th of July long weekend.' },
  { region:'us', name:'Labor Day Weekend',           start:'2027-09-04', end:'2027-09-06', tip:'Last summer holiday.' },
  { region:'us', name:'Thanksgiving Week',           start:'2027-11-24', end:'2027-11-28', tip:'US Thanksgiving.' },
  { region:'us', name:'Christmas Week',              start:'2027-12-22', end:'2027-12-27', tip:'High domestic travel.' },

  // ── BUSY: Japan ──
  { region:'jp', name:'Japan New Year Holiday',      start:'2025-12-26', end:'2026-01-04', tip:'Largest Japanese holiday. Many tourists fly to Hawaii for New Year.' },
  { region:'jp', name:'Japan Spring Break',          start:'2026-03-20', end:'2026-04-05', tip:'Japanese school spring break. Families and students travel abroad.' },
  { region:'jp', name:'Japan Golden Week',           start:'2026-04-29', end:'2026-05-06', tip:'Biggest Japanese holiday week. Showa Day, Constitution Day, Children\'s Day.' },
  { region:'jp', name:'Japan Summer Break',          start:'2026-07-18', end:'2026-08-31', tip:'Japanese school summer break. Peak Japanese tourist season in Hawaii.' },
  { region:'jp', name:'Japan Obon',                  start:'2026-08-10', end:'2026-08-17', tip:'Obon holiday. Many Japanese take time off; Hawaii is a top destination.' },
  { region:'jp', name:'Japan Silver Week',           start:'2026-09-19', end:'2026-09-23', tip:'2026 is a rare 5-day Silver Week. Strong Japanese tourist influx expected.' },
  { region:'jp', name:'Japan New Year Holiday',      start:'2026-12-26', end:'2027-01-03', tip:'Largest Japanese holiday. Many tourists fly to Hawaii for New Year.' },
  { region:'jp', name:'Japan Spring Break',          start:'2027-03-20', end:'2027-04-05', tip:'Japanese school spring break.' },
  { region:'jp', name:'Japan Golden Week',           start:'2027-04-29', end:'2027-05-05', tip:'Biggest Japanese holiday week.' },
  { region:'jp', name:'Japan Summer Break',          start:'2027-07-18', end:'2027-08-31', tip:'Japanese school summer break.' },
  { region:'jp', name:'Japan Obon',                  start:'2027-08-10', end:'2027-08-17', tip:'Obon holiday. Hawaii is a top destination.' },

  // ── BUSY: Hawaii ──
  { region:'hi', name:'September Holidays',          start:'2026-09-13', end:'2026-09-23', tip:'Combines with Silver Week — double boost from Japan & US visitors.' },
  { region:'hi', name:'Honolulu Marathon',           start:'2026-12-11', end:'2026-12-13', tip:'One of the world\'s largest marathons. 30,000+ runners, mostly Japanese. Ala Moana extremely busy.' },
  { region:'hi', name:'September Holidays',          start:'2027-09-13', end:'2027-09-23', tip:'Combines multiple holiday periods — strong visitor numbers.' },
  { region:'hi', name:'Honolulu Marathon',           start:'2027-12-11', end:'2027-12-13', tip:'30,000+ runners, mostly Japanese. Ala Moana extremely busy.' },

  // ── BUSY: Canada ──
  { region:'ca', name:'Canada Snowbird Season',      start:'2026-01-05', end:'2026-03-31', tip:'Canadian retirees and families escape winter by visiting Hawaii. Steady boost Jan-Mar.' },
  { region:'ca', name:'Canada Snowbird Season',      start:'2027-01-04', end:'2027-03-31', tip:'Canadian retirees and families escape winter by visiting Hawaii.' },

  // ── SLOW ──
  { region:'slow', name:'Post-Spring Break Lull',   start:'2026-04-15', end:'2026-04-28', tip:'Spring Break ends, Golden Week not yet started. Quietest period of spring.' },
  { region:'slow', name:'Post-Golden Week Lull',    start:'2026-05-07', end:'2026-05-22', tip:'After Golden Week, before Memorial Day. Low visitor numbers.' },
  { region:'slow', name:'Post-Labor Day Lull',      start:'2026-09-08', end:'2026-09-12', tip:'Brief quiet period after Labor Day before September Holidays.' },
  { region:'slow', name:'Fall Slow Season',         start:'2026-10-08', end:'2026-11-19', tip:'Slowest stretch of the year. Low visitor counts until Thanksgiving.' },
  { region:'slow', name:'Post-Spring Break Lull',   start:'2027-04-15', end:'2027-04-28', tip:'Spring Break ends, Golden Week not yet started.' },
  { region:'slow', name:'Post-Golden Week Lull',    start:'2027-05-07', end:'2027-05-22', tip:'After Golden Week, before Memorial Day.' },
  { region:'slow', name:'Post-Labor Day Lull',      start:'2027-09-07', end:'2027-09-12', tip:'Brief quiet period after Labor Day.' },
  { region:'slow', name:'Fall Slow Season',         start:'2027-10-07', end:'2027-11-18', tip:'Slowest stretch of the year until Thanksgiving.' }
];

var currentYear   = '2026';
var currentFilter = 'all';

function setYear(yr){
  currentYear = yr;
  ['2026','2027','all'].forEach(function(y){
    var btn = document.getElementById('yr-'+y);
    if(btn) btn.className = 'year-btn' + (y===yr?' active':'');
  });
  render();
}

function setFilter(f){
  currentFilter = f;
  ['all','us','jp','hi','ca','slow'].forEach(function(x){
    var btn = document.getElementById('f-'+x);
    if(btn) btn.className = 'filter-btn' + (x===f?' active-'+f:'');
  });
  render();
}

function fmtDate(str){
  var d = new Date(str+'T12:00:00');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]
    + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function fmtDateRange(s, e){
  var ds = new Date(s+'T12:00:00'), de = new Date(e+'T12:00:00');
  var ms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(ds.getFullYear()===de.getFullYear() && ds.getMonth()===de.getMonth())
    return ms[ds.getMonth()]+' '+ds.getDate()+'–'+de.getDate()+', '+ds.getFullYear();
  if(ds.getFullYear()===de.getFullYear())
    return ms[ds.getMonth()]+' '+ds.getDate()+' – '+ms[de.getMonth()]+' '+de.getDate()+', '+ds.getFullYear();
  return ms[ds.getMonth()]+' '+ds.getDate()+', '+ds.getFullYear()+' – '+ms[de.getMonth()]+' '+de.getDate()+', '+de.getFullYear();
}

var REGION_LABELS = { us:'US', jp:'Japan', hi:'Hawaii', ca:'Canada', slow:'Slow Season' };
var REGION_BADGES = { us:'badge-us', jp:'badge-jp', hi:'badge-hi', ca:'badge-ca', slow:'badge-slow' };
var CARD_CLASSES  = { us:'busy-us', jp:'busy-jp', hi:'busy-hi', ca:'busy-ca', slow:'slow' };

function render(){
  var now = new Date(); now.setHours(0,0,0,0);

  var filtered = PERIODS.filter(function(p){
    if(currentFilter!=='all' && p.region!==currentFilter) return false;
    if(currentYear==='2026'){
      // 2026年に重なるもの
      return p.start.substring(0,4)==='2026' || p.end.substring(0,4)==='2026'
        || (p.start<='2026-12-31' && p.end>='2026-01-01');
    }
    if(currentYear==='2027'){
      return p.start.substring(0,4)==='2027' || p.end.substring(0,4)==='2027'
        || (p.start<='2027-12-31' && p.end>='2027-01-01');
    }
    return true;
  });

  // 開始日でソート
  filtered.sort(function(a,b){ return a.start<b.start?-1:a.start>b.start?1:0; });

  if(!filtered.length){
    document.getElementById('seasonList').innerHTML='<div class="no-results">No periods found</div>';
    return;
  }

  // 月ごとにグループ化
  var groups = {};
  var groupOrder = [];
  filtered.forEach(function(p){
    var d = new Date(p.start+'T12:00:00');
    var key = d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1);
    var label = MONTHS[d.getMonth()]+' '+d.getFullYear();
    if(!groups[key]){ groups[key]={label:label,items:[]}; groupOrder.push(key); }
    groups[key].items.push(p);
  });

  var html = '';
  groupOrder.forEach(function(key){
    var g = groups[key];
    html += '<div class="month-head">'+g.label+'</div>';
    g.items.forEach(function(p){
      var isNow = new Date(p.start+'T12:00:00')<=now && new Date(p.end+'T12:00:00')>=now;
      var cardCls = 'period-card ' + (CARD_CLASSES[p.region]||'') + (isNow?' now':'');
      var badgeCls = REGION_BADGES[p.region]||'';
      var regionLabel = REGION_LABELS[p.region]||'';
      var icon = p.region==='us'?'&#127482;&#127480;'
               : p.region==='jp'?'&#127471;&#127477;'
               : p.region==='hi'?'&#127959;'
               : p.region==='ca'?'&#127464;&#127462;'
               : '&#128197;';
      html += '<div class="'+cardCls+'">'
        + '<div class="period-left">'
        + '<div class="period-name">'+p.name+'</div>'
        + '<div class="period-date">'+fmtDateRange(p.start, p.end)+'</div>'
        + (p.tip?'<div class="period-tip">'+p.tip+'</div>':'')
        + '</div>'
        + '<div class="period-right">'
        + '<span class="region-badge '+badgeCls+'">'+icon+' '+regionLabel+'</span>'
        + (isNow?'<span class="now-badge">NOW</span>':'')
        + '</div>'
        + '</div>';
    });
  });

  document.getElementById('seasonList').innerHTML = html;
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', render);
} else {
  render();
}
</script>

<script>
// バージョンチェック（iOS PWA強制更新対応）
function checkVersion(){
  fetch('./version.json?_='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache,no-store'}})
  .then(function(r){return r.json();})
  .then(function(data){
    var sv=String(data.version);
    var lv=localStorage.getItem('st_app_version');
    if(lv&&lv!==sv){
      localStorage.setItem('st_app_version',sv);
      if('caches' in window){
        caches.keys().then(function(keys){
          Promise.all(keys.map(function(k){return caches.delete(k);}))
            .then(function(){window.location.reload(true);});
        });
      } else { window.location.reload(true); }
    } else { localStorage.setItem('st_app_version',sv); }
  }).catch(function(){});
}
checkVersion();
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkVersion();});
</script>

</body>
</html>
